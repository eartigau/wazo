<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Curation des photos</title>
    <style>
        :root {
            --bg: #1a1a2e;
            --bg-card: #16213e;
            --accent: #0f3460;
            --highlight: #e94560;
            --success: #4ade80;
            --warning: #fbbf24;
            --text: #eee;
            --text-dim: #888;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 80px;
        }
        
        .header {
            position: sticky;
            top: 0;
            background: var(--bg);
            padding: 20px;
            border-bottom: 1px solid var(--accent);
            z-index: 100;
        }
        
        .header h1 {
            font-size: 20px;
            margin-bottom: 16px;
            color: var(--highlight);
        }
        
        .toolbar {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .search-box {
            flex: 1;
            min-width: 200px;
            padding: 10px 16px;
            border: 1px solid var(--accent);
            border-radius: 8px;
            background: var(--bg-card);
            color: var(--text);
            font-size: 14px;
        }
        
        .search-box:focus {
            outline: none;
            border-color: var(--highlight);
        }
        
        .filter-group {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        
        .filter-label {
            color: var(--text-dim);
            font-size: 13px;
        }
        
        .filter-btn {
            padding: 8px 14px;
            border: 1px solid var(--accent);
            border-radius: 6px;
            background: var(--bg-card);
            color: var(--text);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .filter-btn:hover {
            border-color: var(--highlight);
        }
        
        .filter-btn.active {
            background: var(--highlight);
            border-color: var(--highlight);
        }
        
        .stats-bar {
            display: flex;
            gap: 16px;
            padding: 12px 20px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--accent);
            font-size: 14px;
            align-items: center;
        }
        
        .stat-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .stat-item.stat-best { color: var(--warning); }
        .stat-item.stat-include { color: var(--success); }
        .stat-item.stat-reject { color: var(--highlight); }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
            padding: 20px;
        }
        
        .card {
            background: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s;
        }
        
        .card:hover {
            transform: translateY(-4px);
        }
        
        .card.status-best {
            box-shadow: 0 0 0 2px var(--warning);
        }
        
        .card.status-reject {
            opacity: 0.5;
        }
        
        .card-image {
            position: relative;
            aspect-ratio: 1;
            cursor: pointer;
            overflow: hidden;
        }
        
        .card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }
        
        .card-image:hover img {
            transform: scale(1.05);
        }
        
        .ml-badge {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background: rgba(0,0,0,0.8);
            color: var(--warning);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-family: monospace;
        }
        
        .card-info {
            padding: 12px;
        }
        
        .card-name {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .card-sci {
            font-size: 12px;
            color: var(--text-dim);
            font-style: italic;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .card-date {
            font-size: 11px;
            color: var(--text-dim);
            margin-bottom: 10px;
        }
        
        .curation-btns {
            display: flex;
            gap: 6px;
        }
        
        .curation-btn {
            flex: 1;
            padding: 8px 4px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--accent);
        }
        
        .curation-btn:hover {
            transform: scale(1.1);
        }
        
        .curation-btn.active.best {
            background: var(--warning);
        }
        
        .curation-btn.active.include {
            background: var(--success);
        }
        
        .curation-btn.active.reject {
            background: var(--highlight);
        }
        
        /* Footer fixe */
        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-card);
            padding: 16px 20px;
            border-top: 1px solid var(--accent);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }
        
        .changes-count {
            color: var(--warning);
            font-weight: 600;
        }
        
        .download-btn {
            padding: 12px 24px;
            background: var(--highlight);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .download-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 20px rgba(233, 69, 96, 0.4);
        }
        
        .download-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--success);
            color: #000;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            opacity: 0;
            transition: all 0.3s;
            z-index: 1000;
        }
        
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📷 Curation des photos</h1>
        <div class="toolbar">
            <input type="text" class="search-box" id="searchBox" placeholder="Rechercher (nom, ML#)...">
            <div class="filter-group">
                <span class="filter-label">Statut:</span>
                <button class="filter-btn active" data-filter="all">Tout</button>
                <button class="filter-btn" data-filter="best">⭐ Meilleur</button>
                <button class="filter-btn" data-filter="include">✓ Inclus</button>
                <button class="filter-btn" data-filter="reject">✗ Rejeté</button>
            </div>
        </div>
    </div>
    
    <div class="stats-bar">
        <span class="stat-item">📷 <span id="count-total">0</span></span>
        <span class="stat-item stat-best">⭐ <span id="count-best">0</span></span>
        <span class="stat-item stat-include">✓ <span id="count-include">0</span></span>
        <span class="stat-item stat-reject">✗ <span id="count-reject">0</span></span>
    </div>
    
    <div class="grid" id="photoGrid">
        {% for photo in photos %}
        <div class="card status-{{ photo.status }}" 
             data-ml="{{ photo.ml_catalog_number }}" 
             data-name="{{ photo.common_name_fr|lower }} {{ photo.common_name_en|lower }} {{ photo.scientific_name|lower }}"
             data-status="{{ photo.status }}">
            <div class="card-image" onclick="copyML('{{ photo.ml_catalog_number }}')">
                <img src="https://cdn.download.ams.birds.cornell.edu/api/v2/asset/{{ photo.ml_catalog_number }}/480" 
                     alt="{{ photo.common_name_fr }}" loading="lazy">
                <span class="ml-badge">{{ photo.ml_catalog_number }}</span>
            </div>
            <div class="card-info">
                <div class="card-name">{{ photo.common_name_fr }}</div>
                <div class="card-sci">{{ photo.scientific_name }}</div>
                <div class="card-date">{{ photo.date_raw }}</div>
                <div class="curation-btns">
                    <button class="curation-btn {% if photo.status == 'best' %}active best{% endif %}" 
                            onclick="setStatus(this, 'best')" title="Meilleure photo">⭐</button>
                    <button class="curation-btn {% if photo.status == 'include' %}active include{% endif %}" 
                            onclick="setStatus(this, 'include')" title="Inclure">✓</button>
                    <button class="curation-btn {% if photo.status == 'reject' %}active reject{% endif %}" 
                            onclick="setStatus(this, 'reject')" title="Rejeter">✗</button>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
    
    <div class="footer">
        <span class="changes-count"><span id="changesCount">0</span> modification(s)</span>
        <button class="download-btn" id="downloadBtn" onclick="downloadCSV()">
            📥 Télécharger CSV
        </button>
    </div>
    
    <div class="toast" id="toast">ML# copié!</div>

    <script>
        let curationData = {};
        let changesCount = 0;
        let currentFilter = 'all';
        
        // Initialiser les données de curation
        document.querySelectorAll('.card').forEach(card => {
            const ml = card.dataset.ml;
            const status = card.dataset.status;
            curationData[ml] = status;
        });
        
        // Copier le numéro ML
        function copyML(ml) {
            navigator.clipboard.writeText(ml).then(() => {
                showToast('ML# ' + ml + ' copié!');
            });
        }
        
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }
        
        // Changer le statut d'une photo
        function setStatus(btn, status) {
            const card = btn.closest('.card');
            const ml = card.dataset.ml;
            const oldStatus = card.dataset.status;
            
            if (oldStatus !== status) {
                changesCount++;
                document.getElementById('changesCount').textContent = changesCount;
            }
            
            // Mettre à jour les données
            curationData[ml] = status;
            card.dataset.status = status;
            
            // Mettre à jour les classes
            card.className = 'card status-' + status;
            
            // Mettre à jour les boutons
            card.querySelectorAll('.curation-btn').forEach(b => {
                b.classList.remove('active', 'best', 'include', 'reject');
            });
            btn.classList.add('active', status);
            
            // Mettre à jour les compteurs
            updateStats();
            
            // Appliquer les filtres
            applyFilters();
        }
        
        // Mettre à jour les statistiques
        function updateStats() {
            const cards = document.querySelectorAll('.card');
            let total = 0, best = 0, include = 0, reject = 0;
            
            cards.forEach(card => {
                total++;
                const status = card.dataset.status;
                if (status === 'best') best++;
                else if (status === 'include') include++;
                else if (status === 'reject') reject++;
            });
            
            document.getElementById('count-total').textContent = total;
            document.getElementById('count-best').textContent = best;
            document.getElementById('count-include').textContent = include;
            document.getElementById('count-reject').textContent = reject;
        }
        
        // Recherche
        document.getElementById('searchBox').addEventListener('input', applyFilters);
        
        // Filtres de statut
        document.querySelectorAll('.filter-btn[data-filter]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn[data-filter]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                applyFilters();
            });
        });
        
        function applyFilters() {
            const search = document.getElementById('searchBox').value.toLowerCase();
            const cards = document.querySelectorAll('.card');
            
            cards.forEach(card => {
                const name = card.dataset.name;
                const ml = card.dataset.ml;
                const status = card.dataset.status;
                
                const matchesSearch = name.includes(search) || ml.includes(search);
                const matchesFilter = currentFilter === 'all' || status === currentFilter;
                
                card.style.display = (matchesSearch && matchesFilter) ? '' : 'none';
            });
        }
        
        // Télécharger le CSV
        function downloadCSV() {
            let csv = 'ml_number,status\n';
            for (const [ml, status] of Object.entries(curationData)) {
                csv += `${ml},${status}\n`;
            }
            
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'photo_curation.csv';
            a.click();
            URL.revokeObjectURL(url);
            
            showToast('CSV téléchargé!');
        }
        
        // Initialiser les stats
        updateStats();
    </script>
</body>
</html>
