    <style>
        /* Carte monde */
        .world-map-container {
            max-width: 1400px;
            margin: 0 auto 40px;
            padding: 0 20px;
        }
        
        .world-map {
            width: 100%;
            height: 400px;
            border-radius: 16px;
            box-shadow: var(--shadow-lg);
            overflow: hidden;
        }
        
        .country-popup {
            text-align: center;
            min-width: 120px;
        }
        
        .country-popup-name {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 4px;
        }
        
        .country-popup-stats {
            font-size: 12px;
            color: #666;
        }
        
        /* Grille pays avec chargement progressif */
        .countries-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px 40px;
        }
        
        .continent-section {
            margin-bottom: 40px;
            scroll-margin-top: 80px;
        }
        
        .continent-title {
            font-family: 'Lora', Georgia, serif;
            font-size: 24px;
            font-weight: 600;
            color: var(--forest-green-dark);
            padding: 12px 0;
            border-bottom: 2px solid var(--forest-green);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .continent-title::before {
            content: '🌍';
            font-size: 20px;
        }
        
        .countries-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        
        .country-card {
            background: var(--bg-white);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow-soft);
            transition: all var(--transition-smooth);
            border: 1px solid var(--border-light);
            text-decoration: none;
            display: block;
        }
        
        .country-card:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-5px);
            border-color: var(--sage);
        }
        
        .country-card-image {
            position: relative;
            aspect-ratio: 16/9;
            overflow: hidden;
        }
        
        .country-card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        
        .country-card:hover .country-card-image img {
            transform: scale(1.05);
        }
        
        .country-card-flag {
            position: absolute;
            top: 12px;
            right: 12px;
            font-size: 28px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }
        
        .country-card-info {
            padding: 16px;
        }
        
        .country-card-name {
            font-family: 'Lora', Georgia, serif;
            font-size: 18px;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 8px;
        }
        
        .country-card-stats {
            font-size: 13px;
            color: var(--text-medium);
        }
        
        .loading-indicator {
            text-align: center;
            padding: 40px;
            color: var(--text-medium);
            font-size: 16px;
        }
        
        .load-more-container {
            text-align: center;
            padding: 20px;
            margin-bottom: 40px;
        }
        
        .load-more-btn {
            background: var(--gradient-forest);
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-md);
        }
        
        .load-more-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }
        
        @media (max-width: 768px) {
            .world-map {
                height: 280px;
            }
            
            .countries-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>

        // ========================================
        // CARTE MONDIALE
        // ========================================
        const map = L.map('world-map', {
            center: [20, 0],
            zoom: 2,
            minZoom: 1,
            maxZoom: 6,
            scrollWheelZoom: true
        });
        
        // Tuiles en niveaux de gris
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap © CARTO',
            subdomains: 'abcd',
            maxZoom: 19
        }).addTo(map);
        
        // Marqueurs pour chaque pays
        countriesData.forEach(country => {
            if (country.lat && country.lng) {
                const marker = L.circleMarker([country.lat, country.lng], {
                    radius: Math.min(8 + Math.log(country.photoCount + 1) * 3, 20),
                    fillColor: '#2d5a27',
                    color: '#fff',
                    weight: 2,
                    opacity: 1,
                    fillOpacity: 0.8
                }).addTo(map);
                
                const name = currentLang === 'fr' ? country.nameFr : country.nameEn;
                const file = currentLang === 'fr' ? country.fileFr : country.fileEn;
                const speciesLabel = currentLang === 'fr' 
                    ? (country.speciesCount > 1 ? 'espèces' : 'espèce')
                    : 'species';
                
                marker.bindPopup(`
                    <div class="country-popup">
                        <div class="country-popup-name">${country.flag} ${name}</div>
                        <div class="country-popup-stats">
                            ${country.photoCount} photo${country.photoCount > 1 ? 's' : ''}<br>
                            ${country.speciesCount} ${speciesLabel}
                        </div>
                        <a href="${file}" style="display: inline-block; margin-top: 8px; color: #2d5a27; font-weight: 600;">
                            ${currentLang === 'fr' ? 'Voir →' : 'View →'}
                        </a>
                    </div>
                `);
                
                marker.on('mouseover', function() {
                    this.openPopup();
                });
            }
        });
        
        // ========================================
        // RENDU PROGRESSIF
        // ========================================
        let displayedCount = 0;
        let renderedContinents = new Set();
        
        // Trier par continent puis par nombre de photos
        const sortedCountries = [...countriesData].sort((a, b) => {
            if (a.continent !== b.continent) {
                return a.continent.localeCompare(b.continent);
            }
            return b.photoCount - a.photoCount;
        });
        
        function createCountryCard(country) {
            const name = currentLang === 'fr' ? country.nameFr : country.nameEn;
            const file = currentLang === 'fr' ? country.fileFr : country.fileEn;
            const speciesLabel = currentLang === 'fr' 
                ? (country.speciesCount > 1 ? 'espèces' : 'espèce')
                : 'species';
            
            const card = document.createElement('a');
            card.href = file;
            card.className = 'country-card';
            
            card.innerHTML = `
                <div class="country-card-image">
                    <img src="https://cdn.download.ams.birds.cornell.edu/api/v2/asset/${country.frontispiceMl}/640" 
                         alt="${name}"
                         loading="lazy">
                    <span class="country-card-flag">${country.flag}</span>
                </div>
                <div class="country-card-info">
                    <h2 class="country-card-name">${name}</h2>
                    <div class="country-card-stats">
                        ${country.photoCount} photo${country.photoCount > 1 ? 's' : ''} · 
                        ${country.speciesCount} ${speciesLabel}
                    </div>
                </div>
            `;
            
            return card;
        }
        
        function createContinentSection(continent, continentFr, continentEn) {
            const section = document.createElement('div');
            section.className = 'continent-section';
            section.id = continent;
            
            const name = currentLang === 'fr' ? continentFr : continentEn;
            
            section.innerHTML = `
                <h2 class="continent-title">${name}</h2>
                <div class="countries-grid"></div>
            `;
            
            return section;
        }
        
        function renderNextBatch() {
            const container = document.getElementById('countries-container');
            const loadingIndicator = document.getElementById('loading-indicator');
            
            if (loadingIndicator) {
                loadingIndicator.style.display = 'none';
            }
            
            const endIndex = Math.min(displayedCount + BATCH_SIZE, sortedCountries.length);
            
            for (let i = displayedCount; i < endIndex; i++) {
                const country = sortedCountries[i];
                
                // Créer la section continent si nécessaire
                if (!renderedContinents.has(country.continent)) {
                    const section = createContinentSection(
                        country.continent,
                        country.continentFr,
                        country.continentEn
                    );
                    container.appendChild(section);
                    renderedContinents.add(country.continent);
                }
                
                // Ajouter la carte pays
                const section = document.getElementById(country.continent);
                const grid = section.querySelector('.countries-grid');
                const card = createCountryCard(country);
                grid.appendChild(card);
            }
            
            displayedCount = endIndex;
            updateLoadMoreButton();
        }
        
        function updateLoadMoreButton() {
            const loadMoreContainer = document.getElementById('load-more-container');
            const remainingCount = document.getElementById('remaining-count');
            const remaining = sortedCountries.length - displayedCount;
            
            if (remaining > 0) {
                loadMoreContainer.style.display = 'block';
                remainingCount.textContent = ` (${remaining} ${currentLang === 'fr' ? 'restant' : 'remaining'}${remaining > 1 && currentLang === 'en' ? 's' : ''})`;
            } else {
                loadMoreContainer.style.display = 'none';
            }
        }
        
        // Charger le premier lot
        renderNextBatch();
        
        // Auto-charger au scroll
        window.addEventListener('scroll', () => {
            if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 500) {
                if (displayedCount < sortedCountries.length) {
                    renderNextBatch();
                }
            }
        });
    </script>
