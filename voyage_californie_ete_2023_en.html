        // ========================================
        // CHARGEMENT PROGRESSIF
        // ========================================
        const BATCH_SIZE = 48;  // Photos par lot
        const showDateInOverlay = false;
        let displayedCount = 0;
        let currentIndex = 0;
        let map = null;
        let marker = null;
        
        function createPhotoCard(photo, index) {
            const card = document.createElement('div');
            card.className = 'photo-card';
            card.dataset.index = index;
            card.dataset.ml = photo.ml;
            card.dataset.location = photo.location || '';
            card.onclick = () => openLightbox(index);
            
            const name = currentLang === 'fr' ? photo.name_fr : photo.name_en;
            const date = currentLang === 'fr' ? photo.date_fr : photo.date_en;
            const dateHtml = showDateInOverlay ? ` · ${date}` : '';
            
            card.innerHTML = `
                <img src="https://cdn.download.ams.birds.cornell.edu/api/v2/asset/${photo.ml}/480"
                     alt="${name}"
                     loading="lazy">
                <div class="photo-overlay">
                    <div class="bird-name">${name}${dateHtml}</div>
                </div>
            `;
            
            return card;
        }
        
        function renderNextBatch() {
            const grid = document.getElementById('photos-grid');
            const loadingIndicator = document.getElementById('loading-indicator');
            
            if (loadingIndicator) {
                loadingIndicator.style.display = 'none';
            }
            
            const endIndex = Math.min(displayedCount + BATCH_SIZE, photosData.length);
            
            for (let i = displayedCount; i < endIndex; i++) {
                const photo = photosData[i];
                const card = createPhotoCard(photo, i);
                grid.appendChild(card);
            }
            
            displayedCount = endIndex;
            updateLoadMoreButton();
        }
        
        function updateLoadMoreButton() {
            const loadMoreContainer = document.getElementById('load-more-container');
            const remainingCount = document.getElementById('remaining-count');
            const remaining = photosData.length - displayedCount;
            
            if (remaining > 0) {
                loadMoreContainer.style.display = 'block';
                const remainingText = currentLang === 'fr' 
                    ? ` (${remaining} restante${remaining > 1 ? 's' : ''})` 
                    : ` (${remaining} remaining)`;
                remainingCount.textContent = remainingText;
            } else {
                loadMoreContainer.style.display = 'none';
            }
        }
        
        // Charger le premier lot au démarrage
        document.addEventListener('DOMContentLoaded', () => {
            renderNextBatch();
        });
        
        // Auto-charger au scroll
        window.addEventListener('scroll', () => {
            if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 800) {
                if (displayedCount < photosData.length) {
                    renderNextBatch();
                }
            }
        });

        function openLightbox(index) {
            const photo = photosData[index];
            if (!photo) return;

            currentIndex = index;
            
            // Image pleine résolution
            document.getElementById('lightbox-img').src = 
                `https://cdn.download.ams.birds.cornell.edu/api/v2/asset/${photo.ml}/2400`;
            
            // Infos selon la langue - famille sans parenthèses
            const familyCode = photo.family.split(' ')[0];  // Prendre juste "Anatidae" sans "(Ducks...)"
            document.getElementById('lightbox-family').textContent = familyCode;
            document.getElementById('lightbox-title').textContent = 
                currentLang === 'fr' ? photo.name_fr : photo.name_en;
            document.getElementById('lightbox-scientific').textContent = photo.scientific;
            document.getElementById('lightbox-location').textContent = 
                currentLang === 'fr' ? photo.location_fr : photo.location_en;
            document.getElementById('lightbox-date').innerHTML = 
                currentLang === 'fr' ? photo.date_fr : photo.date_en;
            document.getElementById('lightbox-ebird').href = 
                `https://ebird.org/checklist/${photo.checklist_id}`;

            // Carte - cachée sur mobile
            const mapDiv = document.getElementById('lightbox-map');
            const isMobile = window.innerWidth <= 768;
            
            if (photo.lat && photo.lng && !isMobile) {
                mapDiv.style.display = 'block';
                
                if (!map) {
                    map = L.map('lightbox-map', {
                        zoomControl: false,
                        attributionControl: false
                    });
                    
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        className: 'grayscale-tiles'
                    }).addTo(map);
                }
                
                map.setView([photo.lat, photo.lng], 8);
                
                const cameraIcon = L.divIcon({
                    className: 'camera-icon',
                    html: '<div class="camera-marker">📷</div>',
                    iconSize: [36, 36],
                    iconAnchor: [18, 18]
                });
                
                if (marker) {
                    marker.setLatLng([photo.lat, photo.lng]);
                } else {
                    marker = L.marker([photo.lat, photo.lng], { icon: cameraIcon }).addTo(map);
                }
                
                setTimeout(() => map.invalidateSize(), 100);
            } else {
                mapDiv.style.display = 'none';
            }

            document.getElementById('lightbox').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.body.style.overflow = '';
        }

        function navigateLightbox(direction) {
            currentIndex = (currentIndex + direction + photosData.length) % photosData.length;
            openLightbox(currentIndex);
        }

        // Clavier
        document.addEventListener('keydown', (e) => {
            if (!document.getElementById('lightbox').classList.contains('active')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') navigateLightbox(-1);
            if (e.key === 'ArrowRight') navigateLightbox(1);
        });

        // Clic hors contenu pour fermer
        document.getElementById('lightbox').addEventListener('click', (e) => {
            if (e.target.id === 'lightbox') closeLightbox();
        });

        // Ouvrir une photo par ML number (pour liens depuis liste espèces)
        function openPhotoByML(ml) {
            const index = photosData.findIndex(p => p.ml === ml);
            if (index >= 0) {
                openLightbox(index);
            }
        }

        // Vérifier si URL contient un paramètre photo
        window.addEventListener('load', () => {
            const params = new URLSearchParams(window.location.search);
            const ml = params.get('photo');
            if (ml) {
                openPhotoByML(ml);
            }
        });

        
        // Carte du voyage avec filtrage par lieu
        const tripLocations = [
            
            { lat: 34.4062989, lng: -119.6882558, name: "Santa Barbara Harbor" },
            
            { lat: 37.7421628, lng: -122.2112274, name: "MLK Jr. Regional Shoreline" },
            
            { lat: 34.7001866, lng: -120.1492202, name: "Zaca Station Rd." },
            
            { lat: 35.6627706, lng: -121.2567043, name: "Pt. Piedras Blancas" },
            
            { lat: 35.546399, lng: -120.958265, name: "Green Valley Road" },
            
            { lat: 36.2019418, lng: -121.7289214, name: "Big Sur coast" },

            { lat: 37.8304863, lng: -122.5329514, name: "Rodeo Lagoon (including beach and offshore)" },
            
            { lat: 37.8277685, lng: -122.4816799, name: "Golden Gate View Point" },
            
            { lat: 37.8259411, lng: -122.422198, name: "Alcatraz Island" },
            
            { lat: 37.7454716, lng: -119.5903015, name: "Yosemite Valley" },
            
            { lat: 37.3295988, lng: -119.6405488, name: "49672 High School Road, Oakhurst" },
            
            { lat: 37.6688071, lng: -119.5859241, name: "Yosemite NP" },
            
            { lat: 33.844483, lng: -118.061955, name: "12658 Renville St" },
            
            { lat: 36.86695, lng: -119.784874, name: "Woodward Park" },
            
            { lat: 33.6965128, lng: -118.0451372, name: "Bolsa Chica" },
            
            { lat: 33.9207496, lng: -118.2603121, name: "Earvin Magic Johnson Park" },
            
            { lat: 33.8148106, lng: -118.088522, name: "El Dorado Regional Park" },
            
            { lat: 33.8501738, lng: -118.0605412, name: "Don Knabe Community Regional Park" },
            
        ];
        
        // Compter les photos par lieu
        function countPhotosByLocation(locationName) {
            return photosData.filter(p => p.location === locationName).length;
        }
        
        // Variable pour garder le filtre actif
        let activeLocationFilter = null;
        
        // Filtrer les photos par lieu
        function filterByLocation(locationName) {
            activeLocationFilter = locationName;
            
            // Charger toutes les photos restantes avant de filtrer
            while (displayedCount < photosData.length) {
                renderNextBatch();
            }
            
            const photoCards = document.querySelectorAll('.photo-card');
            let visibleCount = 0;
            
            photoCards.forEach(card => {
                const cardLocation = card.getAttribute('data-location');
                if (cardLocation === locationName) {
                    card.style.display = '';
                    visibleCount++;
                } else {
                    card.style.display = 'none';
                }
            });
            
            // Cacher le bouton "charger plus" quand filtré
            document.getElementById('load-more-container').style.display = 'none';
            
            // Afficher l'indicateur de filtre
            const indicator = document.getElementById('location-filter-indicator');
            const locationNameSpan = document.getElementById('filter-location-name');
            const photoCountSpan = document.getElementById('filter-photo-count');
            
            if (indicator) {
                locationNameSpan.textContent = locationName;
                photoCountSpan.textContent = currentLang === 'fr' 
                    ? ` (${visibleCount} photo${visibleCount > 1 ? 's' : ''})` 
                    : ` (${visibleCount} photo${visibleCount > 1 ? 's' : ''})`;
                indicator.style.display = 'flex';
            }
            
            // Scroll vers la grille
            document.querySelector('.gallery-container').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
        
        // Réinitialiser le filtre
        function resetLocationFilter() {
            activeLocationFilter = null;
            const photoCards = document.querySelectorAll('.photo-card');
            photoCards.forEach(card => {
                card.style.display = '';
            });
            
            const indicator = document.getElementById('location-filter-indicator');
            if (indicator) {
                indicator.style.display = 'none';
            }
        }

        if (tripLocations.length > 0) {
            // Créer la carte
            const tripMap = L.map('trip-map', {
                scrollWheelZoom: false,
                zoomControl: true
            });

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap'
            }).addTo(tripMap);

            // Icône personnalisée pour les épingles
            const pinIcon = L.divIcon({
                html: '<div class="trip-pin">📍</div>',
                className: 'trip-pin-container',
                iconSize: [24, 24],
                iconAnchor: [12, 24],
                popupAnchor: [0, -24]
            });

            // Ajouter les marqueurs avec compte de photos et filtrage
            const markers = [];
            tripLocations.forEach(loc => {
                const marker = L.marker([loc.lat, loc.lng], { icon: pinIcon });
                const photoCount = countPhotosByLocation(loc.name);
                
                if (loc.name) {
                    // Popup avec nom et compte de photos
                    const popupContent = `
                        <div class="trip-popup-content">
                            <strong>${loc.name}</strong>
                            <div class="popup-photo-count">${photoCount} photo${photoCount > 1 ? 's' : ''}</div>
                            <button class="popup-filter-btn" onclick="filterByLocation('${loc.name.replace(/'/g, "\\'")}')">
                                ${currentLang === 'fr' ? 'Voir ces photos' : 'View photos'}
                            </button>
                        </div>
                    `;
                    marker.bindPopup(popupContent, { className: 'trip-popup' });
                }
                
                // Clic direct sur le marqueur (pas le popup) pour filtrer
                marker.on('click', function(e) {
                    // Ne pas filtrer si on ouvre juste le popup
                    // Le filtrage se fait via le bouton dans le popup
                });
                
                marker.addTo(tripMap);
                markers.push(marker);
            });

            // Ajuster la vue pour montrer tous les marqueurs
            if (markers.length > 0) {
                const group = L.featureGroup(markers);
                tripMap.fitBounds(group.getBounds().pad(0.1));
                
                // Limiter le zoom max pour garder du contexte
                if (tripMap.getZoom() > 10) {
                    tripMap.setZoom(10);
                }
            }
        }
        
        
        // Menu mobile hamburger
        function toggleMobileMenu() {
            document.getElementById('navMenu').classList.toggle('active');
        }
        
        // Fermer menu au clic ailleurs
        document.addEventListener('click', (e) => {
            const nav = document.querySelector('nav');
            const menu = document.getElementById('navMenu');
            if (menu && !nav.contains(e.target)) {
                menu.classList.remove('active');
            }
        });
        
        // Swipe pour lightbox sur mobile
        let touchStartX = 0;
        let touchEndX = 0;
        
        document.getElementById('lightbox').addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });
        
        document.getElementById('lightbox').addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, { passive: true });
        
        function handleSwipe() {
            const diff = touchStartX - touchEndX;
            if (Math.abs(diff) > 50) {
                if (diff > 0) {
                    navigateLightbox(1); // Swipe gauche = suivant
                } else {
                    navigateLightbox(-1); // Swipe droite = précédent
                }
            }
        }
    </script>
