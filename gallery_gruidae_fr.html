    <!-- EN-TÊTE -->

    <!-- GRILLE PHOTOS -->
    <div class="gallery-container">
        <div class="masonry-grid">
            
            <div class="photo-card" 
                 data-index="0"
                 data-ml="615415584"
                 onclick="openLightbox(0)">
                <img src="https://cdn.download.ams.birds.cornell.edu/api/v2/asset/615415584/480"
                     alt="Grue du Canada"
                     loading="lazy">
                <div class="photo-overlay">
                    <div class="bird-name">Grue du Canada</div>
                </div>
            </div>
            
            <div class="photo-card" 
                 data-index="1"
                 data-ml="51318941"
                 onclick="openLightbox(1)">
                <img src="https://cdn.download.ams.birds.cornell.edu/api/v2/asset/51318941/480"
                     alt="Grue du Canada"
                     loading="lazy">
                <div class="photo-overlay">
                    <div class="bird-name">Grue du Canada</div>
                </div>
            </div>
            
            <div class="photo-card" 
                 data-index="2"
                 data-ml="51318951"
                 onclick="openLightbox(2)">
                <img src="https://cdn.download.ams.birds.cornell.edu/api/v2/asset/51318951/480"
                     alt="Grue du Canada"
                     loading="lazy">
                <div class="photo-overlay">
                    <div class="bird-name">Grue du Canada</div>
                </div>
            </div>
            
            <div class="photo-card" 
                 data-index="3"
                 data-ml="51320051"
                 onclick="openLightbox(3)">
                <img src="https://cdn.download.ams.birds.cornell.edu/api/v2/asset/51320051/480"
                     alt="Grue du Canada"
                     loading="lazy">
                <div class="photo-overlay">
                    <div class="bird-name">Grue du Canada</div>
                </div>
            </div>
            
            <div class="photo-card" 
                 data-index="4"
                 data-ml="51320061"
                 onclick="openLightbox(4)">
                <img src="https://cdn.download.ams.birds.cornell.edu/api/v2/asset/51320061/480"
                     alt="Grue du Canada"
                     loading="lazy">
                <div class="photo-overlay">
                    <div class="bird-name">Grue du Canada</div>
                </div>
            </div>
            
        </div>
    </div>

    <!-- LIGHTBOX -->
    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
        <button class="lightbox-nav lightbox-prev" onclick="navigateLightbox(-1)">&#10094;</button>
        <button class="lightbox-nav lightbox-next" onclick="navigateLightbox(1)">&#10095;</button>
        
        <div class="lightbox-content">
            <div class="lightbox-image-container">
                <img id="lightbox-img" src="" alt="">
            </div>
            <div class="lightbox-sidebar">
                <!-- Famille -->
                <div class="lightbox-family" id="lightbox-family"></div>
                
                <!-- Nom commun -->
                <h2 id="lightbox-title"></h2>
                
                <!-- Nom scientifique -->
                <p class="scientific-name" id="lightbox-scientific"></p>
                
                <!-- Section Info -->
                <div class="lightbox-info">
                    <div class="info-row" id="lightbox-location-row">
                        <span class="info-icon">🌍</span>
                        <span id="lightbox-location"></span>
                    </div>
                    <div class="info-row" id="lightbox-date-row">
                        <span class="info-icon">📅</span>
                        <span id="lightbox-date"></span>
                    </div>
                </div>
                
                <!-- Carte -->
                <div id="lightbox-map"></div>
                
                <!-- Lien eBird -->
                <a id="lightbox-ebird" href="#" target="_blank" class="ebird-link">
                    <img src="https://ebird.org/favicon.ico" alt="eBird" class="ebird-icon">
                    Voir sur eBird
                </a>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer>
        <p>Données <a href="https://ebird.org" target="_blank">eBird</a> / <a href="https://macaulaylibrary.org" target="_blank">Macaulay Library</a> · Mise à jour : 6 décembre 2025</p>
        <p>© Étienne Artigau</p>
    </footer>

    <!-- SCRIPTS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const currentLang = 'fr';
        
        const photosData = [
            
            {
                ml: "615415584",
                name_fr: "Grue du Canada",
                name_en: "Sandhill Crane",
                scientific: "Antigone canadensis",
                family: "Gruidae (Cranes)",
                location_fr: "Babcock-Webb WMA, Floride, États-Unis",
                location_en: "Babcock-Webb WMA, Florida, United States",
                date_fr: "27 février 2024",
                date_en: "February 27<sup>th</sup>, 2024",
                lat: 26.8582653,
                lng: -81.9401121,
                checklist_id: "S163084754"
            },
            
            {
                ml: "51318941",
                name_fr: "Grue du Canada",
                name_en: "Sandhill Crane",
                scientific: "Antigone canadensis",
                family: "Gruidae (Cranes)",
                location_fr: "Brevard Zoo, Floride, États-Unis",
                location_en: "Brevard Zoo, Florida, United States",
                date_fr: "10 mars 2017",
                date_en: "March 10<sup>th</sup>, 2017",
                lat: 28.2254954,
                lng: -80.7144928,
                checklist_id: "S35093839"
            },
            
            {
                ml: "51318951",
                name_fr: "Grue du Canada",
                name_en: "Sandhill Crane",
                scientific: "Antigone canadensis",
                family: "Gruidae (Cranes)",
                location_fr: "Brevard Zoo, Floride, États-Unis",
                location_en: "Brevard Zoo, Florida, United States",
                date_fr: "10 mars 2017",
                date_en: "March 10<sup>th</sup>, 2017",
                lat: 28.2254954,
                lng: -80.7144928,
                checklist_id: "S35093839"
            },
            
            {
                ml: "51320051",
                name_fr: "Grue du Canada",
                name_en: "Sandhill Crane",
                scientific: "Antigone canadensis",
                family: "Gruidae (Cranes)",
                location_fr: "Brevard Zoo, Floride, États-Unis",
                location_en: "Brevard Zoo, Florida, United States",
                date_fr: "7 mars 2017",
                date_en: "March 7<sup>th</sup>, 2017",
                lat: 28.2254954,
                lng: -80.7144928,
                checklist_id: "S35031563"
            },
            
            {
                ml: "51320061",
                name_fr: "Grue du Canada",
                name_en: "Sandhill Crane",
                scientific: "Antigone canadensis",
                family: "Gruidae (Cranes)",
                location_fr: "Brevard Zoo, Floride, États-Unis",
                location_en: "Brevard Zoo, Florida, United States",
                date_fr: "7 mars 2017",
                date_en: "March 7<sup>th</sup>, 2017",
                lat: 28.2254954,
                lng: -80.7144928,
                checklist_id: "S35031563"
            }
            
        ];

        let currentIndex = 0;
        let map = null;
        let marker = null;

        function openLightbox(index) {
            const photo = photosData[index];
            if (!photo) return;

            currentIndex = index;
            
            // Image pleine résolution
            document.getElementById('lightbox-img').src = 
                `https://cdn.download.ams.birds.cornell.edu/api/v2/asset/${photo.ml}/2400`;
            
            // Infos selon la langue - famille sans parenthèses
            const familyCode = photo.family.split(' ')[0];  // Prendre juste "Anatidae" sans "(Ducks...)"
            document.getElementById('lightbox-family').textContent = familyCode;
            document.getElementById('lightbox-title').textContent = 
                currentLang === 'fr' ? photo.name_fr : photo.name_en;
            document.getElementById('lightbox-scientific').textContent = photo.scientific;
            document.getElementById('lightbox-location').textContent = 
                currentLang === 'fr' ? photo.location_fr : photo.location_en;
            document.getElementById('lightbox-date').innerHTML = 
                currentLang === 'fr' ? photo.date_fr : photo.date_en;
            document.getElementById('lightbox-ebird').href = 
                `https://ebird.org/checklist/${photo.checklist_id}`;

            // Carte
            const mapDiv = document.getElementById('lightbox-map');
            if (photo.lat && photo.lng) {
                mapDiv.style.display = 'block';
                
                if (!map) {
                    map = L.map('lightbox-map', {
                        zoomControl: false,
                        attributionControl: false
                    });
                    
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        className: 'grayscale-tiles'
                    }).addTo(map);
                }
                
                map.setView([photo.lat, photo.lng], 8);
                
                const cameraIcon = L.divIcon({
                    className: 'camera-icon',
                    html: '<div class="camera-marker">📷</div>',
                    iconSize: [36, 36],
                    iconAnchor: [18, 18]
                });
                
                if (marker) {
                    marker.setLatLng([photo.lat, photo.lng]);
                } else {
                    marker = L.marker([photo.lat, photo.lng], { icon: cameraIcon }).addTo(map);
                }
                
                setTimeout(() => map.invalidateSize(), 100);
            } else {
                mapDiv.style.display = 'none';
            }

            document.getElementById('lightbox').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.body.style.overflow = '';
        }

        function navigateLightbox(direction) {
            currentIndex = (currentIndex + direction + photosData.length) % photosData.length;
            openLightbox(currentIndex);
        }

        // Clavier
        document.addEventListener('keydown', (e) => {
            if (!document.getElementById('lightbox').classList.contains('active')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') navigateLightbox(-1);
            if (e.key === 'ArrowRight') navigateLightbox(1);
        });

        // Clic hors contenu pour fermer
        document.getElementById('lightbox').addEventListener('click', (e) => {
            if (e.target.id === 'lightbox') closeLightbox();
        });

        // Ouvrir une photo par ML number (pour liens depuis liste espèces)
        function openPhotoByML(ml) {
            const index = photosData.findIndex(p => p.ml === ml);
            if (index >= 0) {
                openLightbox(index);
            }
        }

        // Vérifier si URL contient un paramètre photo
        window.addEventListener('load', () => {
            const params = new URLSearchParams(window.location.search);
            const ml = params.get('photo');
            if (ml) {
                openPhotoByML(ml);
            }
        });
    </script>
</body>
</html>
