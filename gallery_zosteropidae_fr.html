<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Famille des Zosteropidaes</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css">
    <link rel="stylesheet" href="gallery.css">
    <style>
        /* Cluster personnalisé avec icône caméra */
        .cluster-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            background: linear-gradient(135deg, #2d5a27 0%, #4a7c39 100%);
            color: white;
            border-radius: 50%;
            border: 3px solid white;
            box-shadow: 0 3px 10px rgba(0,0,0,0.3);
            font-weight: 700;
            font-size: 13px;
        }
        .cluster-icon-small {
            width: 40px;
            height: 40px;
        }
        .cluster-icon-medium {
            width: 50px;
            height: 50px;
            font-size: 14px;
        }
        .cluster-icon-large {
            width: 60px;
            height: 60px;
            font-size: 15px;
        }
        /* Marqueur flamant rose individuel */
        .flamingo-marker {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #2d5a27 0%, #4a7c39 100%);
            border-radius: 50%;
            border: 3px solid white;
            box-shadow: 0 3px 10px rgba(0,0,0,0.3);
            font-size: 20px;
            cursor: pointer;
        }
        .flamingo-marker:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>

        <div class="nav-container">

                <li>
                    <a href="gallery_best_fr.html"

                <li>
                    <a href="voyages_index_fr.html"

                <li>
                    <a href="pays_index_fr.html"

                <li>
                    <a href="familles_index_fr.html" 
                       >
                        Familles
                    </a>

            </ul>
            
            <!-- Sélecteur de langue -->
            <div class="lang-switch" style="display: flex; flex-direction: row; align-items: center; gap: 0; background: #f5f3f0; border-radius: 20px; padding: 4px;">
                
                <span class="lang-btn active" style="display: inline-flex; align-items: center; justify-content: center; padding: 6px 14px; border-radius: 16px; font-size: 13px; font-weight: 600; background: #2d5a27; color: white;">FR</span>
                <a href="gallery_zosteropidae_en.html" class="lang-btn" title="English" style="display: inline-flex; align-items: center; justify-content: center; padding: 6px 14px; border-radius: 16px; font-size: 13px; font-weight: 600; background: transparent; color: #7a8a7a; text-decoration: none;">EN</a>
                
            </div>
        </div>
    </nav>

    <!-- EN-TÊTE -->
    <div class="gallery-header">
        
        <h1>Famille des Zosteropidaes</h1>
        
        <div class="gallery-subtitle">Zostérops</div>
        
        <div class="stats">
            6 photos
            
             · 1 espèce
            
        </div>
    </div>

    

    <!-- GRILLE PHOTOS -->
    <div class="gallery-container">
        
        
        <div class="masonry-grid" id="photos-grid">
            <!-- Photos chargées dynamiquement par JavaScript -->
        </div>
        
        <!-- Indicateur de chargement -->
        <div id="loading-indicator" class="loading-indicator" style="text-align: center; padding: 40px; color: var(--text-medium);">
            Chargement...
        </div>
        
        <!-- Bouton charger plus -->
        <div id="load-more-container" class="load-more-container" style="text-align: center; padding: 20px; display: none;">
            <button class="load-more-btn" id="load-more-btn" onclick="renderNextBatch()" style="background: linear-gradient(135deg, #2d5a27 0%, #4a7c39 100%); color: white; border: none; padding: 14px 32px; border-radius: 30px; font-size: 15px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 15px rgba(45, 90, 39, 0.3);">
                Afficher plus de photos
                <span id="remaining-count"></span>
            </button>
        </div>
    </div>

    <!-- LIGHTBOX -->
    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
        <button class="lightbox-nav lightbox-prev" onclick="navigateLightbox(-1)">&#10094;</button>
        <button class="lightbox-nav lightbox-next" onclick="navigateLightbox(1)">&#10095;</button>
        
        <div class="lightbox-content">
            <div class="lightbox-image-container">
                <img id="lightbox-img" src="" alt="">
            </div>
            <div class="lightbox-sidebar">
                <!-- Famille -->
                <div class="lightbox-family" id="lightbox-family"></div>
                
                <!-- Nom commun -->
                <h2 id="lightbox-title"></h2>
                
                <!-- Nom scientifique -->
                <p class="scientific-name" id="lightbox-scientific"></p>
                
                <!-- Section Info -->
                <div class="lightbox-info">
                    <div class="info-row" id="lightbox-location-row">
                        <span class="info-icon">🌍</span>
                        <span id="lightbox-location"></span>
                    </div>
                    <div class="info-row" id="lightbox-date-row">
                        <span class="info-icon">📅</span>
                        <span id="lightbox-date"></span>
                    </div>
                </div>
                
                <!-- Carte -->
                <div id="lightbox-map"></div>
                
                <!-- Lien eBird -->
                <a id="lightbox-ebird" href="#" target="_blank" class="ebird-link">
                    <img src="https://ebird.org/favicon.ico" alt="eBird" class="ebird-icon">
                    Voir sur eBird
                </a>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer>
        <p>Données <a href="https://ebird.org" target="_blank">eBird</a> / <a href="https://macaulaylibrary.org" target="_blank">Macaulay Library</a> · Mise à jour : 8 janvier 2026</p>
        <p>© Étienne Artigau</p>
    </footer>

    <!-- SCRIPTS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <script>
        const currentLang = 'fr';
        
        const photosData = [
            
            {
                ml: "101876191",
                name_fr: "Zostérops du Japon",
                name_en: "Warbling White-eye",
                scientific: "Zosterops japonicus",
                family: "Zosteropidae (White-eyes, Yuhinas, and Allies)",
                location: "Kuʻu aliʻi Fishpond",
                location_fr: "Kuʻu aliʻi Fishpond, Hawaï, États-Unis",
                location_en: "Kuʻu aliʻi Fishpond, Hawaii, United States",
                date_fr: "23 mai 2018",
                date_en: "May 23<sup>rd</sup>, 2018",
                lat: 19.9150848,
                lng: -155.8867816,
                checklist_id: "S45973676"
            },
            
            {
                ml: "22493851",
                name_fr: "Zostérops du Japon",
                name_en: "Warbling White-eye",
                scientific: "Zosterops japonicus",
                family: "Zosteropidae (White-eyes, Yuhinas, and Allies)",
                location: "Kawaihae village",
                location_fr: "Kawaihae village, Hawaï, États-Unis",
                location_en: "Kawaihae village, Hawaii, United States",
                date_fr: "28 juillet 2015",
                date_en: "July 28<sup>th</sup>, 2015",
                lat: 20.0232946,
                lng: -155.8091676,
                checklist_id: "S24411523"
            },
            
            {
                ml: "21099171",
                name_fr: "Zostérops du Japon",
                name_en: "Warbling White-eye",
                scientific: "Zosterops japonicus",
                family: "Zosteropidae (White-eyes, Yuhinas, and Allies)",
                location: "Kuʻu aliʻi Fishpond",
                location_fr: "Kuʻu aliʻi Fishpond, Hawaï, États-Unis",
                location_en: "Kuʻu aliʻi Fishpond, Hawaii, United States",
                date_fr: "17 octobre 2012",
                date_en: "October 17<sup>th</sup>, 2012",
                lat: 19.9150848,
                lng: -155.8867816,
                checklist_id: "S18574896"
            },
            
            {
                ml: "21099191",
                name_fr: "Zostérops du Japon",
                name_en: "Warbling White-eye",
                scientific: "Zosterops japonicus",
                family: "Zosteropidae (White-eyes, Yuhinas, and Allies)",
                location: "Kuʻu aliʻi Fishpond",
                location_fr: "Kuʻu aliʻi Fishpond, Hawaï, États-Unis",
                location_en: "Kuʻu aliʻi Fishpond, Hawaii, United States",
                date_fr: "17 octobre 2012",
                date_en: "October 17<sup>th</sup>, 2012",
                lat: 19.9150848,
                lng: -155.8867816,
                checklist_id: "S18574896"
            },
            
            {
                ml: "22486891",
                name_fr: "Zostérops du Japon",
                name_en: "Warbling White-eye",
                scientific: "Zosterops japonicus",
                family: "Zosteropidae (White-eyes, Yuhinas, and Allies)",
                location: "Kaloko-Honokōhau NHP",
                location_fr: "Kaloko-Honokōhau NHP, Hawaï, États-Unis",
                location_en: "Kaloko-Honokōhau NHP, Hawaii, United States",
                date_fr: "15 avril 2007",
                date_en: "April 15<sup>th</sup>, 2007",
                lat: 19.6771833,
                lng: -156.0259759,
                checklist_id: "S18574909"
            },
            
            {
                ml: "29633841",
                name_fr: "Zostérops du Japon",
                name_en: "Warbling White-eye",
                scientific: "Zosterops japonicus",
                family: "Zosteropidae (White-eyes, Yuhinas, and Allies)",
                location: "Kaloko-Honokōhau NHP",
                location_fr: "Kaloko-Honokōhau NHP, Hawaï, États-Unis",
                location_en: "Kaloko-Honokōhau NHP, Hawaii, United States",
                date_fr: "31 mars 2007",
                date_en: "March 31<sup>st</sup>, 2007",
                lat: 19.6771833,
                lng: -156.0259759,
                checklist_id: "S18574832"
            }
            
        ];

        // ========================================
        // CHARGEMENT PROGRESSIF
        // ========================================
        const BATCH_SIZE = 48;  // Photos par lot
        const showDateInOverlay = false;
        let displayedCount = 0;
        let currentIndex = 0;
        let map = null;
        let marker = null;
        
        function createPhotoCard(photo, index) {
            const card = document.createElement('div');
            card.className = 'photo-card';
            card.dataset.index = index;
            card.dataset.ml = photo.ml;
            card.dataset.location = photo.location || '';
            card.onclick = () => openLightbox(index);
            
            const name = currentLang === 'fr' ? photo.name_fr : photo.name_en;
            const date = currentLang === 'fr' ? photo.date_fr : photo.date_en;
            const dateHtml = showDateInOverlay ? ` · ${date}` : '';
            
            card.innerHTML = `
                <img src="https://cdn.download.ams.birds.cornell.edu/api/v2/asset/${photo.ml}/480"
                     alt="${name}"
                     loading="lazy">
                <div class="photo-overlay">
                    <div class="bird-name">${name}${dateHtml}</div>
                </div>
            `;
            
            return card;
        }
        
        function renderNextBatch() {
            const grid = document.getElementById('photos-grid');
            const loadingIndicator = document.getElementById('loading-indicator');
            
            if (loadingIndicator) {
                loadingIndicator.style.display = 'none';
            }
            
            const endIndex = Math.min(displayedCount + BATCH_SIZE, photosData.length);
            
            for (let i = displayedCount; i < endIndex; i++) {
                const photo = photosData[i];
                const card = createPhotoCard(photo, i);
                grid.appendChild(card);
            }
            
            displayedCount = endIndex;
            updateLoadMoreButton();
        }
        
        function updateLoadMoreButton() {
            const loadMoreContainer = document.getElementById('load-more-container');
            const remainingCount = document.getElementById('remaining-count');
            const remaining = photosData.length - displayedCount;
            
            if (remaining > 0) {
                loadMoreContainer.style.display = 'block';
                const remainingText = currentLang === 'fr' 
                    ? ` (${remaining} restante${remaining > 1 ? 's' : ''})` 
                    : ` (${remaining} remaining)`;
                remainingCount.textContent = remainingText;
            } else {
                loadMoreContainer.style.display = 'none';
            }
        }
        
        // Charger le premier lot au démarrage
        document.addEventListener('DOMContentLoaded', () => {
            renderNextBatch();
        });
        
        // Auto-charger au scroll
        window.addEventListener('scroll', () => {
            if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 800) {
                if (displayedCount < photosData.length) {
                    renderNextBatch();
                }
            }
        });

        function openLightbox(index) {
            const photo = photosData[index];
            if (!photo) return;

            currentIndex = index;
            
            // Image pleine résolution
            document.getElementById('lightbox-img').src = 
                `https://cdn.download.ams.birds.cornell.edu/api/v2/asset/${photo.ml}/2400`;
            
            // Infos selon la langue - famille sans parenthèses
            const familyCode = photo.family.split(' ')[0];  // Prendre juste "Anatidae" sans "(Ducks...)"
            document.getElementById('lightbox-family').textContent = familyCode;
            document.getElementById('lightbox-title').textContent = 
                currentLang === 'fr' ? photo.name_fr : photo.name_en;
            document.getElementById('lightbox-scientific').textContent = photo.scientific;
            document.getElementById('lightbox-location').textContent = 
                currentLang === 'fr' ? photo.location_fr : photo.location_en;
            document.getElementById('lightbox-date').innerHTML = 
                currentLang === 'fr' ? photo.date_fr : photo.date_en;
            document.getElementById('lightbox-ebird').href = 
                `https://ebird.org/checklist/${photo.checklist_id}`;

            // Carte - cachée sur mobile
            const mapDiv = document.getElementById('lightbox-map');
            const isMobile = window.innerWidth <= 768;
            
            if (photo.lat && photo.lng && !isMobile) {
                mapDiv.style.display = 'block';
                
                if (!map) {
                    map = L.map('lightbox-map', {
                        zoomControl: false,
                        attributionControl: false
                    });
                    
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        className: 'grayscale-tiles'
                    }).addTo(map);
                }
                
                map.setView([photo.lat, photo.lng], 8);
                
                const flamingoIcon = L.divIcon({
                    className: '',
                    html: '<div class="flamingo-marker">🦩</div>',
                    iconSize: [36, 36],
                    iconAnchor: [18, 18]
                });
                
                if (marker) {
                    marker.setLatLng([photo.lat, photo.lng]);
                } else {
                    marker = L.marker([photo.lat, photo.lng], { icon: flamingoIcon }).addTo(map);
                }
                
                setTimeout(() => map.invalidateSize(), 100);
            } else {
                mapDiv.style.display = 'none';
            }

            document.getElementById('lightbox').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.body.style.overflow = '';
        }

        function navigateLightbox(direction) {
            currentIndex = (currentIndex + direction + photosData.length) % photosData.length;
            openLightbox(currentIndex);
        }

        // Clavier
        document.addEventListener('keydown', (e) => {
            if (!document.getElementById('lightbox').classList.contains('active')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') navigateLightbox(-1);
            if (e.key === 'ArrowRight') navigateLightbox(1);
        });

        // Clic hors contenu pour fermer
        document.getElementById('lightbox').addEventListener('click', (e) => {
            if (e.target.id === 'lightbox') closeLightbox();
        });

        // Ouvrir une photo par ML number (pour liens depuis liste espèces)
        function openPhotoByML(ml) {
            const index = photosData.findIndex(p => p.ml === ml);
            if (index >= 0) {
                openLightbox(index);
            }
        }

        // Vérifier si URL contient un paramètre photo
        window.addEventListener('load', () => {
            const params = new URLSearchParams(window.location.search);
            const ml = params.get('photo');
            if (ml) {
                openPhotoByML(ml);
            }
        });

        
        
        // Menu mobile hamburger
        function toggleMobileMenu() {
            document.getElementById('navMenu').classList.toggle('active');
        }
        
        // Fermer menu au clic ailleurs
        document.addEventListener('click', (e) => {
            const nav = document.querySelector('nav');
            const menu = document.getElementById('navMenu');
            if (menu && !nav.contains(e.target)) {
                menu.classList.remove('active');
            }
        });
        
        // Swipe pour lightbox sur mobile
        let touchStartX = 0;
        let touchEndX = 0;
        
        document.getElementById('lightbox').addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });
        
        document.getElementById('lightbox').addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, { passive: true });
        
        function handleSwipe() {
            const diff = touchStartX - touchEndX;
            if (Math.abs(diff) > 50) {
                if (diff > 0) {
                    navigateLightbox(1); // Swipe gauche = suivant
                } else {
                    navigateLightbox(-1); // Swipe droite = précédent
                }
            }
        }
    </script>
</body>
</html>
