        /* Compteur d'espèces par famille */
        .family-title {
            display: flex;
            align-items: baseline;
            gap: 8px;
            flex-wrap: wrap;
        }
        .family-count {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-medium);
            margin-left: auto;
        }
        .family-title a.family-link {
            color: inherit;
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s;
        }
        .family-title a.family-link:hover {
            border-bottom-color: currentColor;
        }

        /* Wrapper image avec skeleton : petite marge intérieure, fond = couleur de la carte
           (pas de bande visible), et ce sont les coins de la photo elle-même (taille auto,
           pas 100%) qui sont arrondis. Ratio fixe 3:2 pour toutes les cartes : une photo
           portrait est encadrée avec de la marge horizontale plutôt que de faire varier la
           hauteur de la case. */
        .card-image-wrapper {
            position: relative;
            aspect-ratio: 3/2;
            overflow: hidden;
            border-radius: 10px;
            background: var(--bg-white);
            margin: 6px 6px 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-image-wrapper .skeleton-image {
            position: absolute;
            inset: 0;
        }
        /* Taille de secours avant que le JS (onload) ne calcule les dimensions exactes :
           Safari ne résout pas correctement width:auto/height:auto + max-width/max-height
           sur un enfant flex (il ignore parfois max-height), ce qui rognait certaines
           photos portrait. */
        .card-image-wrapper .lazy-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 10px;
            opacity: 0;
            transition: opacity 0.4s ease-out;
        }
        .card-image-wrapper .lazy-image.loaded {
            opacity: 1;
        }
    </style>
</head>

        // Calcule et fixe la taille exacte (en px) de l'image pour qu'elle tienne dans son
        // conteneur en respectant son ratio, sans dépendre de l'algorithme du navigateur :
        // Safari ne gère pas toujours bien width:auto/height:auto + max-width/max-height
        // sur un enfant flex (il ignore parfois max-height), ce qui rognait certaines
        // photos portrait.
        function fitContain(img) {
            const box = img.parentElement;
            const cs = getComputedStyle(box);
            const availW = box.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
            const availH = box.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
            const scale = Math.min(availW / img.naturalWidth, availH / img.naturalHeight);
            img.style.width = Math.round(img.naturalWidth * scale) + 'px';
            img.style.height = Math.round(img.naturalHeight * scale) + 'px';
        }

                nameEn: "Bananaquit",
                ml: "515235431",
                photoCount: 4,
                familyCode: "Thraupidae",

                familyNameEn: "Tanagers and Allies"
            },
            
            {
                sciName: "Tiaris olivaceus",
                nameFr: "Tiaris grand-chanteur",
                nameEn: "Yellow-faced Grassquit",
                ml: "22392481",
                photoCount: 2,
                familyCode: "Thraupidae",
                familyDisplayFr: "Thraupidae",
                familyDisplayEn: "Thraupidae",
                familyNameFr: "Sicales, Phrygiles, Incaspizes, etc.",
                familyNameEn: "Tanagers and Allies"
            }
            
            
        ];
        
        // Compteur d'espèces par famille
        const familyCounts = {};
        speciesListData.forEach(sp => {
            familyCounts[sp.familyCode] = (familyCounts[sp.familyCode] || 0) + 1;
        });

        // ========================================
        // ÉTAT DE L'APPLICATION
        // ========================================
        let displayedCount = 0;
        let filteredSpecies = [...speciesListData];
        let currentSearchQuery = '';
        let renderedFamilies = new Set();

        // ========================================
        // RENDU DYNAMIQUE DES CARTES
        // ========================================
        
        function normalizeText(text) {
            return text.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
        }
        
        function createSpeciesCard(sp) {
            const card = document.createElement('div');
            card.className = 'species-card';
            card.dataset.species = sp.sciName;
            card.dataset.nameFr = sp.nameFr.toLowerCase();
            card.dataset.nameEn = sp.nameEn.toLowerCase();
            card.dataset.sciName = sp.sciName.toLowerCase();
            card.title = sp.sciName;
            card.onclick = () => openSpeciesLightbox(sp.sciName);

            const name = currentLang === 'fr' ? sp.nameFr : sp.nameEn;
            const badgeHtml = `<span class="photo-count-badge">${sp.photoCount}</span>`;

            card.innerHTML = `
                <div class="card-image-wrapper">
                    <div class="skeleton-image"></div>
                    <img class="lazy-image"
                         src="https://cdn.download.ams.birds.cornell.edu/api/v2/asset/${sp.ml}/480"
                         alt="${name}"
                         loading="lazy"
                         onload="this.classList.add('loaded'); this.previousElementSibling.style.display='none'; fitContain(this);">
                    ${badgeHtml}
                </div>
                <div class="species-info">
                    <span class="species-common">${name}</span>
                    <span class="species-sci">${sp.sciName}</span>
                </div>
            `;

            return card;
        }
        
        function createFamilySection(familyCode, familyDisplayFr, familyDisplayEn, familyNameFr, familyNameEn, count) {
            const section = document.createElement('div');
            section.className = 'family-section';
            section.id = familyCode;
            section.dataset.family = familyCode;
            
            const display = currentLang === 'fr' ? familyDisplayFr : familyDisplayEn;
            const name = currentLang === 'fr' ? familyNameFr : familyNameEn;
            const nameHtml = name ? ` (${name})` : '';
            const countLabel = currentLang === 'fr'
                ? `${count} espèce${count > 1 ? 's' : ''}`
                : `${count} species`;
            const titleContent = familyCode !== 'Unknown'
                ? `<a class="family-link" href="gallery_${familyCode.toLowerCase()}_${currentLang}.html">${display}${nameHtml}</a>`
                : `${display}${nameHtml}`;

            section.innerHTML = `
                <h2 class="family-title">
                    <span>${titleContent}</span>
                    <span class="family-count">${countLabel}</span>
                </h2>
                <div class="species-grid"></div>
            `;
            
            return section;
        }
        
        function renderNextBatch() {
            const container = document.getElementById('species-list-dynamic');
            const loadingIndicator = document.getElementById('loading-indicator');
            
            // Cacher l'indicateur de chargement initial
            if (loadingIndicator) {
                loadingIndicator.style.display = 'none';
            }
            
            const toRender = filteredSpecies.slice(displayedCount, displayedCount + BATCH_SIZE);
            
            if (toRender.length === 0) {
                updateLoadMoreButton();
                return;
            }
            
            // Grouper par famille
            toRender.forEach(sp => {
                let familySection = document.getElementById(sp.familyCode);
                
                // Créer la section famille si elle n'existe pas
                if (!familySection) {
                    familySection = createFamilySection(
                        sp.familyCode, 
                        sp.familyDisplayFr, 
                        sp.familyDisplayEn,
                        sp.familyNameFr,
                        sp.familyNameEn,
                        familyCounts[sp.familyCode] || 0
                    );
                    container.appendChild(familySection);
                    renderedFamilies.add(sp.familyCode);
                }
                
                // Ajouter la carte d'espèce
                const grid = familySection.querySelector('.species-grid');
                const card = createSpeciesCard(sp);
                
                // Ajouter classe highlight si recherche active
                if (currentSearchQuery.length >= 2) {
                    card.classList.add('search-highlight');
                }
                
                grid.appendChild(card);
            });
            
            displayedCount += toRender.length;
            updateLoadMoreButton();
        }
        
        function updateLoadMoreButton() {
            const container = document.getElementById('load-more-container');
            const remaining = filteredSpecies.length - displayedCount;
            
            if (remaining > 0) {
                container.style.display = 'flex';
                const countSpan = document.getElementById('remaining-count');
                countSpan.textContent = currentLang === 'fr' 
                    ? ` (${remaining} restantes)` 
                    : ` (${remaining} remaining)`;
            } else {
                container.style.display = 'none';
            }
        }
        
        function clearRenderedContent() {
            const container = document.getElementById('species-list-dynamic');
            // Supprimer toutes les sections famille
            const sections = container.querySelectorAll('.family-section');
            sections.forEach(s => s.remove());

            displayedCount = 0;
            renderedFamilies.clear();
        }


        // ========================================
        // RECHERCHE D'ESPÈCES
        // ========================================
        
        function filterSpecies(query) {
            currentSearchQuery = query;
            const normalizedQuery = normalizeText(query);
            
            if (normalizedQuery.length < 2) {
                // Réinitialiser à la liste complète
                filteredSpecies = [...speciesListData];
                document.getElementById('search-results').style.display = 'none';
                document.getElementById('search-clear').style.display = 'none';
            } else {
                // Filtrer
                filteredSpecies = speciesListData.filter(sp => 
                    normalizeText(sp.nameFr).includes(normalizedQuery) ||
                    normalizeText(sp.nameEn).includes(normalizedQuery) ||
                    normalizeText(sp.sciName).includes(normalizedQuery)
                );
                
                document.getElementById('search-clear').style.display = 'block';
                
                // Afficher le compteur de résultats
                const searchResults = document.getElementById('search-results');
                if (filteredSpecies.length > 0) {
                    const resultText = currentLang === 'fr' 
                        ? `${filteredSpecies.length} espèce${filteredSpecies.length > 1 ? 's' : ''} trouvée${filteredSpecies.length > 1 ? 's' : ''}`
                        : `${filteredSpecies.length} species found`;
                    searchResults.textContent = resultText;
                } else {
                    searchResults.textContent = currentLang === 'fr' 
                        ? 'Aucune espèce trouvée'
                        : 'No species found';
                }
                searchResults.style.display = 'block';
            }
            
            // Effacer et re-rendre
            clearRenderedContent();
            renderNextBatch();
        }

        // Cliquer une espèce ouvre le feed plein écran (infinite scroll) sur cette espèce

        function openSpeciesLightbox(sciName) {
            const idx = speciesListData.findIndex(sp => sp.sciName === sciName);
            if (idx < 0) return;
            window.location.href = `${FEED_URL}?s=${idx}`;
        }

        // Retour du feed plein écran sur une espèce précise (?species=<nom scientifique>) :
        // dérouler les lots nécessaires (chargement progressif) puis défiler jusqu'à la carte,
        // même si elle n'était pas encore affichée — important pour cette liste de plusieurs
        // centaines d'espèces où la cible peut être loin en bas.
        window.addEventListener('load', () => {
            const params = new URLSearchParams(window.location.search);
            const targetSci = params.get('species');
            if (!targetSci) return;
            const idx = filteredSpecies.findIndex(sp => sp.sciName === targetSci);
            if (idx < 0) return;
            while (displayedCount <= idx) {
                renderNextBatch();
            }
            const card = document.querySelector(`.species-card[data-species="${CSS.escape(targetSci)}"]`);
            if (card) {
                card.scrollIntoView({ block: 'center' });
                card.classList.add('return-highlight');
                setTimeout(() => card.classList.remove('return-highlight'), 1600);
            }
        });

        // ========================================
        // ÉVÉNEMENTS
        // ========================================

        // Bouton retour en haut
        const backToTop = document.getElementById('backToTop');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 500) {
                backToTop.classList.add('visible');
            } else {
                backToTop.classList.remove('visible');
            }
        });

        // Recherche
        const searchInput = document.getElementById('species-search');
        const searchClear = document.getElementById('search-clear');
        
        searchInput.addEventListener('input', (e) => {
            filterSpecies(e.target.value);
        });

        searchClear.addEventListener('click', () => {
            searchInput.value = '';
            filterSpecies('');
            searchInput.focus();
        });

        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                searchInput.value = '';
                filterSpecies('');
            }
        });
        
        // Scroll infini - charge automatiquement au scroll
        let scrollTimeout;
        window.addEventListener('scroll', () => {
            if (scrollTimeout) clearTimeout(scrollTimeout);
            scrollTimeout = setTimeout(() => {
                // Charger plus quand on approche du bas
                if ((window.innerHeight + window.scrollY) >= (document.body.offsetHeight - 1000)) {
                    if (displayedCount < filteredSpecies.length) {
                        renderNextBatch();
                    }
                }
            }, 100);
        });

        // ========================================
        // INITIALISATION
        // ========================================
        document.addEventListener('DOMContentLoaded', () => {
            renderNextBatch();
        });
    </script>
