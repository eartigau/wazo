<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Hawaï automne 2015</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
        margin: 0; padding: 0; height: 100%;
        background: #000; overscroll-behavior-y: contain;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .feed {
        height: 100vh; height: 100dvh;
        overflow-y: scroll;
        scroll-snap-type: y mandatory;
    }

    .item {
        position: relative;
        width: 100%;
        height: 100vh; height: 100dvh;
        overflow: hidden;
        background: #111;
        scroll-snap-align: start;
        scroll-snap-stop: always;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8vh 8vw;
    }

    /* Taille de secours (100%/100%) avant que le JS (onload, fitContain) ne calcule les
       dimensions exactes en pixels : Safari ne résout pas correctement
       width:auto/height:auto + max-width/max-height sur un enfant flex (il ignore parfois
       max-height), ce qui rognait certaines photos portrait. La boîte de l'image doit
       épouser sa taille réellement affichée, sinon les coins arrondis tombent dans la zone
       transparente du letterboxing et ne se voient jamais. */
    .item img {
        width: 100%; height: 100%;
        object-fit: contain;
        display: block;
        border-radius: 16px;
        pointer-events: none;
        user-select: none;
        -webkit-user-select: none;
    }

    /* barre du haut, transparente, pas de recul du contenu, pas de dégradé */
    .top-bar {
        position: absolute; top: 0; left: 0; right: 0; z-index: 6;
        padding: max(14px, env(safe-area-inset-top)) 14px 0;
        display: flex; align-items: center; justify-content: space-between;
    }
    .back-link { text-decoration: none; }
    .back-link .icon-circle { font-size: 20px; font-weight: 700; }
    .counter-pill {
        color: #fff; font-size: 12px; font-weight: 600;
        background: rgba(255,255,255,.15); backdrop-filter: blur(6px);
        padding: 5px 12px; border-radius: 999px;
        border: none; font-family: inherit;
    }

    /* bandeau légende façon eBird : barre sombre attachée sous la photo (au lieu d'un
       simple halo de texte sur la photo), alignée sur la même marge que la photo */
    .caption {
        position: absolute; left: 8vw; right: 8vw; bottom: 0; z-index: 4;
        padding: 10px 14px max(14px, env(safe-area-inset-bottom));
        background: rgba(20, 28, 18, 0.92);
        border-radius: 10px 10px 0 0;
        color: #fff;
    }
    .handle-line {
        display: block;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .handle-name {
        font-weight: 700; font-size: 15px;
    }
    .handle-sci {
        font-style: italic; font-weight: 500; font-size: 13px;
    }
    .handle-loc {
        font-weight: 500; font-size: 13px;
        opacity: .92;
    }
    .handle-date {
        font-weight: 500; font-size: 13px;
        opacity: .85;
    }
    .handle-sep {
        opacity: .6; font-size: 13px;
    }

    /* colonne d'icônes à gauche, style Reels */
    .side-icons {
        position: absolute; left: 10px; bottom: 96px; z-index: 5;
        display: flex; flex-direction: column; align-items: center; gap: 20px;
    }

    /* navigation haut/bas à mi-hauteur à droite, pour se déplacer dans la galerie */
    .nav-updown {
        position: fixed; right: 10px; top: 50%; transform: translateY(-50%); z-index: 5;
        display: flex; flex-direction: column; align-items: center; gap: 14px;
    }
    .icon-btn {
        background: none; border: none; color: #fff; padding: 0;
        display: flex; flex-direction: column; align-items: center; gap: 4px;
        font-size: 11px; font-weight: 600;
        text-shadow: 0 1px 4px rgba(0,0,0,.8);
    }
    .icon-circle {
        width: 46px; height: 46px; border-radius: 50%;
        background: rgba(255,255,255,.14); backdrop-filter: blur(6px);
        display: flex; align-items: center; justify-content: center; font-size: 22px;
        transition: background .15s, transform .15s;
    }
    .icon-btn:active .icon-circle { transform: scale(.92); }
    .icon-circle .ebird-icon {
        width: 22px; height: 22px;
        filter: grayscale(1) brightness(2.5);
        opacity: .9;
    }

    /* fiche de détail (icône info) */
    .detail {
        position: absolute; left: 0; right: 0; bottom: 0; z-index: 10;
        max-height: 68%; overflow-y: auto;
        background: rgba(18,16,14,.96); backdrop-filter: blur(10px);
        color: #f4ece3;
        padding: 20px 20px max(20px, env(safe-area-inset-bottom));
        border-radius: 18px 18px 0 0;
        transform: translateY(100%);
        transition: transform .3s ease;
    }
    .item.expanded .detail { transform: translateY(0); }
    .item.expanded .caption,
    .item.expanded .side-icons {
        opacity: 0; pointer-events: none; transition: opacity .2s;
    }
    .detail-close {
        position: absolute; top: 12px; right: 14px;
        width: 32px; height: 32px; border: none; border-radius: 50%;
        background: rgba(255,255,255,.12); color: #fff; font-size: 20px; line-height: 1;
    }
    .detail h3 { margin: 0 36px 2px 0; font-size: 19px; font-family: Georgia, serif; }
    .detail .sci { font-style: italic; color: #c9beb2; margin: 0 0 10px; font-size: 13px; }
    .detail-row { font-size: 13px; margin-bottom: 6px; color: #e6ddd2; }
    .ebird-btn {
        display: inline-flex; align-items: center; gap: 8px; margin-top: 12px;
        padding: 9px 16px; border-radius: 8px;
        background: #332d27; border: 1px solid #4b4137;
        color: #f0e8dd; font-size: 13px; text-decoration: none;
    }
    .ebird-btn img { width: 15px; height: 15px; filter: grayscale(1) brightness(2.5); opacity: .7; }

    /* Info à gauche, carte à droite (colonnes façon tableau, sans bordure) */
    .detail-columns {
        display: flex;
        flex-direction: column;
        gap: 14px;
    }
    .detail-info { min-width: 0; }
    .detail-map {
        width: 100%;
        aspect-ratio: 3 / 2;
        max-height: 220px;
        margin-top: 12px;
        border-radius: 10px;
        overflow: hidden;
        background: #e7dfd4;
    }

    @media (min-width: 769px) {
        .detail-columns {
            flex-direction: row;
            align-items: flex-start;
        }
        .detail-info {
            flex: 1;
        }
        .detail-map {
            width: 240px;
            aspect-ratio: 3 / 2;
            max-height: none;
            margin-top: 0;
            flex-shrink: 0;
        }
    }
    .detail-map .leaflet-tile {
        filter: grayscale(88%) contrast(1.02) sepia(6%) brightness(1.03);
    }
    .flamingo-marker {
        display: flex; align-items: center; justify-content: center;
        width: 30px; height: 30px;
        background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
        border-radius: 50%; border: 2px solid #2d5a27;
        box-shadow: 0 3px 10px rgba(0,0,0,.3);
        font-size: 16px;
    }

    .end-of-feed {
        display: flex; align-items: center; justify-content: center;
        height: 100vh; height: 100dvh;
        color: rgba(255,255,255,.55); font-size: 14px; text-align: center; padding: 0 40px;
    }

    /* Curseur pour se déplacer rapidement dans la galerie (tap sur le compteur) */
    .scrubber-overlay {
        position: fixed; inset: 0; z-index: 50;
        background: rgba(0,0,0,.8); backdrop-filter: blur(4px);
        display: none; flex-direction: column; align-items: center; justify-content: center;
        padding: 24px; color: #fff;
    }
    .scrubber-overlay.active { display: flex; }
    .scrubber-close {
        position: absolute; top: max(14px, env(safe-area-inset-top)); right: 14px;
        width: 36px; height: 36px; border-radius: 50%;
        background: rgba(255,255,255,.15); border: none; color: #fff; font-size: 20px; line-height: 1;
    }
    /* Liste défilante par espèce (pas par photo), avec la cible centrée en surbrillance */
    .species-picker-wrap {
        position: relative;
        width: 100%; max-width: 340px;
        height: 280px; /* 7 rangées x 40px : 3 au-dessus, 1 centrée, 3 en-dessous */
    }
    @media (min-width: 769px) {
        /* En mode ordinateur, la liste utilise (presque) toute la hauteur de la fenêtre : on voit beaucoup plus de noms */
        .species-picker-wrap {
            height: 82vh;
        }
    }
    .picker-highlight {
        position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%);
        height: 40px; pointer-events: none;
        background: rgba(255,255,255,.08);
        border-top: 1px solid rgba(255,255,255,.28);
        border-bottom: 1px solid rgba(255,255,255,.28);
    }
    .species-picker {
        height: 100%; overflow-y: scroll;
        scroll-snap-type: y mandatory;
        -webkit-overflow-scrolling: touch;
    }
    .picker-row, .picker-spacer {
        height: 40px;
        display: flex; align-items: center; justify-content: center;
        scroll-snap-align: center;
        font-size: 15px; color: rgba(255,255,255,.45);
        text-align: center; padding: 0 12px;
        transition: color .12s, font-size .12s;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .picker-row.active {
        color: #fff; font-size: 19px; font-weight: 700;
        font-family: Georgia, serif;
    }
    .scrubber-sci {
        margin-top: 18px; font-size: 13px; font-style: italic;
        color: rgba(255,255,255,.7); text-align: center;
    }
</style>
</head>
<body>
    <div class="feed" id="feed"></div>

    <!-- Navigation haut/bas : se déplacer dans la galerie -->
    <div class="nav-updown">
        <button type="button" class="icon-btn nav-up" id="navUp" aria-label="Photo précédente" title="Photo précédente">
            <span class="icon-circle">↑</span>
        </button>
        <button type="button" class="icon-btn nav-down" id="navDown" aria-label="Photo suivante" title="Photo suivante">
            <span class="icon-circle">↓</span>
        </button>
    </div>

    <!-- Curseur de navigation rapide (ouvert via le bouton liste ☰) -->
    <div class="scrubber-overlay" id="scrubberOverlay">
        <button type="button" class="scrubber-close" id="scrubberClose">&times;</button>
        <div class="species-picker-wrap">
            <div class="picker-highlight"></div>
            <div class="species-picker" id="speciesPicker"></div>
        </div>
        <div class="scrubber-sci" id="scrubberSci"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const LANG = 'fr';
        const BACK_URL = 'voyage_hawaii_automne2015_fr.html';

        // Lien de retour vers une espèce précise plutôt que le haut de la galerie de départ :
        // la page de départ lit ce paramètre pour dérouler les lots nécessaires et défiler
        // jusqu'à la bonne carte (voir species_list_template.html / gallery_template.html).
        function backUrlFor(sciName) {
            if (!sciName) return BACK_URL;
            const sep = BACK_URL.includes('?') ? '&' : '?';
            return `${BACK_URL}${sep}species=${encodeURIComponent(sciName)}`;
        }

        // Calcule et fixe la taille exacte (en px) de l'image pour qu'elle tienne dans son
        // conteneur en respectant son ratio, sans dépendre de l'algorithme du navigateur :
        // Safari ne gère pas toujours bien width:auto/height:auto + max-width/max-height
        // sur un enfant flex (il ignore parfois max-height), ce qui rognait certaines
        // photos portrait.
        function fitContain(img) {
            const box = img.parentElement;
            const cs = getComputedStyle(box);
            const availW = box.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
            const availH = box.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
            const scale = Math.min(availW / img.naturalWidth, availH / img.naturalHeight);
            img.style.width = Math.round(img.naturalWidth * scale) + 'px';
            img.style.height = Math.round(img.naturalHeight * scale) + 'px';
        }

        // Le feed plein écran ne doit jamais être la page d'arrivée : on n'y entre qu'en cliquant
        // une espèce (lien avec ?s=...). Sans ce paramètre, on renvoie vers la grille.
        if (new URLSearchParams(location.search).get('s') === null) {
            window.location.replace(BACK_URL);
        }

        // Les données photos sont chargées de façon asynchrone (fetch), pas embarquées dans
        // le HTML : pour les galeries à plusieurs milliers de photos (ex: species_list), un
        // gros bloc JSON en ligne bloquait le rendu initial le temps d'être parsé au complet.
        const DATA_URL = 'voyage_hawaii_automne2015_feed_data.json';
        let speciesList = [];
        let flatList = [];

        const BATCH_SIZE = 6;
        let shown = 0;
        let renderedFrom = 0;  // premier index affiché dans le feed (peut être > 0 après un saut)
        const feed = document.getElementById('feed');

        // Regroupe les photos par espèce (ordre conservé, identique à la grille) et aplatit
        // en flatList, chaque entrée sachant à quelle espèce elle appartient. Appelé une fois
        // le JSON récupéré.
        function buildLists(photosData) {
            const speciesMap = {};
            const speciesOrder = [];
            photosData.forEach((photo) => {
                const sci = photo.scientific;
                if (!speciesMap[sci]) {
                    speciesMap[sci] = {
                        scientific: sci,
                        name_fr: photo.name_fr,
                        name_en: photo.name_en,
                        iucn_status: photo.iucn_status,
                        photos: []
                    };
                    speciesOrder.push(sci);
                }
                speciesMap[sci].photos.push(photo);
            });
            speciesList = speciesOrder.map(sci => speciesMap[sci]);

            flatList = [];
            speciesList.forEach(sp => {
                sp.photos.forEach(photo => flatList.push({ photo, species: sp }));
            });
        }

        const statusNames = {
            'CR': { fr: 'En danger critique', en: 'Critically Endangered' },
            'EN': { fr: 'En danger', en: 'Endangered' },
            'VU': { fr: 'Vulnérable', en: 'Vulnerable' },
            'NT': { fr: 'Quasi menacé', en: 'Near Threatened' },
            'DD': { fr: 'Données insuffisantes', en: 'Data Deficient' }
        };

        // Calcule le niveau de zoom Leaflet donnant ~spanKm de large dans un conteneur de
        // containerWidthPx pixels, à la latitude donnée (ajustement Mercator via cos(lat)).
        function zoomForSpanKm(containerWidthPx, spanKm, latDeg) {
            const KM_PER_PIXEL_AT_ZOOM0_EQUATOR = 40075 / 256;
            const kmPerPixelAtZoom0 = KM_PER_PIXEL_AT_ZOOM0_EQUATOR * Math.cos(latDeg * Math.PI / 180);
            const desiredKmPerPixel = spanKm / containerWidthPx;
            return Math.log2(kmPerPixelAtZoom0 / desiredKmPerPixel);
        }

        // Carte Leaflet créée à la demande, seulement quand on ouvre la fiche "Infos"
        // (pas à la création de chaque item : on éviterait des centaines d'instances de carte)
        function initDetailMap(item, photo) {
            const mapEl = item.querySelector('.detail-map');
            if (!mapEl || mapEl.dataset.initialized || !photo.lat || !photo.lng) return;
            mapEl.dataset.initialized = 'true';
            // Attendre la fin de l'animation d'ouverture de la fiche pour que Leaflet mesure le bon conteneur
            setTimeout(() => {
                const map = L.map(mapEl, { zoomControl: false, attributionControl: false });
                L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                    maxZoom: 19
                }).addTo(map);
                // Portée d'environ 2000 km de large, peu importe la taille du conteneur ou la latitude
                const zoom = Math.round(zoomForSpanKm(mapEl.clientWidth, 2000, photo.lat));
                map.setView([photo.lat, photo.lng], zoom);
                const icon = L.divIcon({
                    className: '',
                    html: '<div class="flamingo-marker">🦩</div>',
                    iconSize: [30, 30],
                    iconAnchor: [15, 15]
                });
                L.marker([photo.lat, photo.lng], { icon }).addTo(map);
                setTimeout(() => map.invalidateSize(), 50);
            }, 320);
        }

        function iucnRow(iucnStatus) {
            if (!iucnStatus || iucnStatus === 'LC' || iucnStatus === 'NE' || iucnStatus === '') return '';
            const code = iucnStatus.split(' ')[0];
            const info = statusNames[code];
            const label = info ? (LANG === 'fr' ? info.fr : info.en) : iucnStatus;
            const prefix = LANG === 'fr' ? 'Statut IUCN' : 'IUCN Status';
            return `<div class="detail-row">⚠️ ${prefix} : ${label}</div>`;
        }

        // "Lieu, Pays" : nom court du lieu + dernier segment (le pays) du nom complet
        function locationCountry(shortLoc, fullLoc) {
            if (!fullLoc) return shortLoc || '';
            const parts = fullLoc.split(',').map(s => s.trim()).filter(Boolean);
            if (parts.length === 0) return shortLoc || '';
            const country = parts[parts.length - 1];
            if (!shortLoc) return country;
            return `${shortLoc}, ${country}`;
        }

        function createItem(entry, globalIndex) {
            const item = document.createElement('div');
            item.className = 'item';

            const name = LANG === 'fr' ? entry.species.name_fr : entry.species.name_en;
            const location = LANG === 'fr' ? entry.photo.location_fr : entry.photo.location_en;
            const dateHtml = LANG === 'fr' ? entry.photo.date_fr : entry.photo.date_en;
            const sciName = entry.species.scientific;
            const ebirdUrl = entry.photo.checklist_id ? `https://ebird.org/checklist/${entry.photo.checklist_id}` : null;
            const ebirdLabel = LANG === 'fr' ? 'Voir sur eBird' : 'View on eBird';

            const listLabel = LANG === 'fr' ? 'Liste des espèces' : 'Species list';
            const infoLabel = LANG === 'fr' ? 'Infos' : 'Info';
            const locCountry = locationCountry(entry.photo.location, location);

            item.innerHTML = `
                <img src="https://cdn.download.ams.birds.cornell.edu/api/v2/asset/${entry.photo.ml}/1200" alt="${name}" loading="lazy" onload="fitContain(this)">

                <div class="top-bar">
                    <a class="icon-btn back-link" href="${backUrlFor(sciName)}" onclick="event.stopPropagation()" aria-label="Retour">
                        <span class="icon-circle">←</span>
                    </a>
                    <span class="counter-pill">${globalIndex + 1} / ${flatList.length}</span>
                </div>

                <div class="caption">
                    <div class="handle-line">
                        <span class="handle-name">${name}</span>
                        <span class="handle-sep"> ~ </span>
                        <span class="handle-sci">${sciName}</span>
                        ${locCountry ? `<span class="handle-sep"> ~ </span><span class="handle-loc">${locCountry}</span>` : ''}
                        ${dateHtml ? `<span class="handle-sep"> ~ </span><span class="handle-date">${dateHtml}</span>` : ''}
                    </div>
                </div>

                <div class="side-icons">
                    <button type="button" class="icon-btn scrubber-btn" aria-label="${listLabel}" title="${listLabel}">
                        <span class="icon-circle">☰</span>
                    </button>
                    <button type="button" class="icon-btn info-btn" aria-label="${infoLabel}" title="${infoLabel}">
                        <span class="icon-circle">ⓘ</span>
                    </button>
                    ${ebirdUrl ? `
                    <a class="icon-btn" href="${ebirdUrl}" target="_blank" onclick="event.stopPropagation()" aria-label="eBird" title="eBird">
                        <span class="icon-circle"><img class="ebird-icon" src="https://ebird.org/favicon.ico" alt="eBird"></span>
                    </a>` : ''}
                </div>

                <div class="detail">
                    <button type="button" class="detail-close">&times;</button>
                    <div class="detail-columns">
                        <div class="detail-info">
                            <h3>${name}</h3>
                            <p class="sci">${sciName}</p>
                            ${iucnRow(entry.species.iucn_status || entry.photo.iucn_status)}
                            ${location ? `<div class="detail-row">🌍 ${location}</div>` : ''}
                            ${dateHtml ? `<div class="detail-row">📅 ${dateHtml}</div>` : ''}
                            ${ebirdUrl ? `<a class="ebird-btn" href="${ebirdUrl}" target="_blank"><img src="https://ebird.org/favicon.ico" alt="">${ebirdLabel}</a>` : ''}
                        </div>
                        ${(entry.photo.lat && entry.photo.lng) ? `<div class="detail-map"></div>` : ''}
                    </div>
                </div>
            `;

            item.querySelector('.scrubber-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                openScrubber(globalIndex);
            });

            item.querySelector('.info-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                item.classList.add('expanded');
                initDetailMap(item, entry.photo);
            });

            item.querySelector('.detail-close').addEventListener('click', (e) => {
                e.stopPropagation();
                item.classList.remove('expanded');
            });

            // Un clic n'importe où sur l'item ferme la fiche d'infos si elle est ouverte.
            // La liste des espèces s'ouvre uniquement via le bouton dédié (.scrubber-btn),
            // pas au clic sur l'item : sinon un clic pour donner le focus à la fenêtre
            // (avant d'utiliser la barre d'espace pour défiler) ouvrait la liste par erreur.
            item.addEventListener('click', () => {
                if (item.classList.contains('expanded')) {
                    item.classList.remove('expanded');
                }
            });

            return item;
        }

        function renderNextBatch() {
            const end = Math.min(shown + BATCH_SIZE, flatList.length);
            for (let i = shown; i < end; i++) {
                feed.appendChild(createItem(flatList[i], i));
            }
            shown = end;
            if (shown >= flatList.length) {
                const endEl = document.createElement('div');
                endEl.className = 'end-of-feed';
                endEl.textContent = LANG === 'fr'
                    ? `Fin — ${flatList.length} photos`
                    : `End — ${flatList.length} photos`;
                feed.appendChild(endEl);
            }
        }

        // Symétrique de renderNextBatch, vers le haut : après un saut direct (jumpToIndex),
        // rien n'est rendu avant renderedFrom, donc remonter au-delà de la photo cliquée ne
        // montrait rien. On insère un lot avant et on compense scrollTop du montant ajouté
        // pour que la position visuelle ne bouge pas (tous les items font exactement une
        // hauteur d'écran, donc le calcul est exact).
        function renderPrevBatch() {
            if (renderedFrom <= 0) return;
            const start = Math.max(renderedFrom - BATCH_SIZE, 0);
            const frag = document.createDocumentFragment();
            for (let i = start; i < renderedFrom; i++) {
                frag.appendChild(createItem(flatList[i], i));
            }
            const addedCount = renderedFrom - start;
            renderedFrom = start;
            feed.insertBefore(frag, feed.firstChild);
            feed.scrollTop += addedCount * feed.clientHeight;
        }

        feed.addEventListener('scroll', () => {
            if (feed.scrollTop + feed.clientHeight >= feed.scrollHeight - feed.clientHeight * 2) {
                if (shown < flatList.length) renderNextBatch();
            }
            if (feed.scrollTop <= feed.clientHeight * 2) {
                if (renderedFrom > 0) renderPrevBatch();
            }
        });

        // Boutons haut/bas : avancent d'une photo, le scroll-snap fait le reste
        document.getElementById('navUp').addEventListener('click', () => {
            feed.scrollBy({ top: -feed.clientHeight, behavior: 'smooth' });
        });
        document.getElementById('navDown').addEventListener('click', () => {
            feed.scrollBy({ top: feed.clientHeight, behavior: 'smooth' });
        });

        // ========================================
        // CURSEUR DE NAVIGATION RAPIDE (une rangée par ESPÈCE, pas par photo)
        // ========================================
        const ROW_HEIGHT = 40;
        let speciesStartIndex = [];

        const scrubberOverlay = document.getElementById('scrubberOverlay');
        const scrubberSci = document.getElementById('scrubberSci');
        const picker = document.getElementById('speciesPicker');
        let pickerRows = [];

        // Rangées vides en haut et en bas pour pouvoir centrer la 1ère et la dernière espèce.
        // On calcule la hauteur attendue directement (plutôt que de mesurer .species-picker-wrap.clientHeight),
        // car cet élément est display:none tant que le curseur n'a jamais été ouvert : sa hauteur mesurée
        // serait 0 et fausserait complètement le calcul de centrage. On reproduit donc ici la même logique
        // que le média query CSS (@media min-width: 769px -> 82vh, sinon 280px fixes).
        const isDesktopPicker = window.innerWidth >= 769;
        const pickerWrapHeight = isDesktopPicker ? window.innerHeight * 0.82 : 280;
        const SPACER_COUNT = Math.max(1, Math.round(pickerWrapHeight / (2 * ROW_HEIGHT) - 0.5));

        // Construit l'index de départ de chaque espèce et remplit la liste défilante du
        // curseur. Appelé une fois les données chargées, puisque tout dépend de speciesList.
        function populateScrubber() {
            let acc = 0;
            speciesStartIndex = [];
            speciesList.forEach(sp => { speciesStartIndex.push(acc); acc += sp.photos.length; });

            let html = '';
            for (let i = 0; i < SPACER_COUNT; i++) html += `<div class="picker-spacer"></div>`;
            speciesList.forEach((sp, i) => {
                const name = LANG === 'fr' ? sp.name_fr : sp.name_en;
                html += `<div class="picker-row" data-index="${i}">${name}</div>`;
            });
            for (let i = 0; i < SPACER_COUNT; i++) html += `<div class="picker-spacer"></div>`;
            picker.innerHTML = html;

            pickerRows = picker.querySelectorAll('.picker-row');
        }

        function centeredSpeciesIndex() {
            const idx = Math.round(picker.scrollTop / ROW_HEIGHT);
            return Math.max(0, Math.min(speciesList.length - 1, idx));
        }

        function updatePickerHighlight() {
            const idx = centeredSpeciesIndex();
            pickerRows.forEach(row => {
                const rIdx = parseInt(row.dataset.index, 10);
                row.classList.toggle('active', rIdx === idx);
                row.style.opacity = Math.max(0.25, 1 - Math.abs(rIdx - idx) * 0.28);
            });
            const sp = speciesList[idx];
            scrubberSci.textContent = `${sp.scientific} · ${sp.photos.length} photo${sp.photos.length > 1 ? 's' : ''}`;
        }

        // Le scroll ne fait QUE mettre à jour l'aperçu/surbrillance en direct.
        // Aucun saut automatique quand le scroll s'arrête : on ne saute que sur
        // un tap à l'extérieur de la liste (voir plus bas).
        picker.addEventListener('scroll', () => {
            requestAnimationFrame(updatePickerHighlight);
        });

        function openScrubber(globalPhotoIndex) {
            const entry = flatList[globalPhotoIndex];
            const speciesIdx = speciesList.indexOf(entry.species);
            scrubberOverlay.classList.add('active');
            picker.scrollTop = speciesIdx * ROW_HEIGHT;
            updatePickerHighlight();
        }

        function closeScrubber() {
            scrubberOverlay.classList.remove('active');
        }

        // Saute directement à l'index visé plutôt que de rendre séquentiellement tout ce
        // qu'il y a avant : pour une galerie de plusieurs milliers de photos (species_list),
        // rendre depuis le début pour atteindre une espèce tardive (ex: ?s=179) était très
        // lent (des centaines d'items créés avant même que la page ne devienne visible).
        function jumpToIndex(targetIndex) {
            if (targetIndex < renderedFrom || targetIndex >= shown) {
                feed.innerHTML = '';
                renderedFrom = targetIndex;
                shown = targetIndex;
                renderNextBatch();
                // Précharge un peu de contenu juste avant la cible : sans ça feed.scrollTop
                // resterait bloqué à 0 pile sur la cible, et aucun évènement 'scroll' ne se
                // déclenche jamais en essayant de remonter au-delà (impossible de scroller
                // "avant" scrollTop=0), donc renderPrevBatch ne serait jamais appelé.
                renderPrevBatch();
            }
            const items = feed.querySelectorAll('.item');
            const targetEl = items[targetIndex - renderedFrom];
            if (targetEl) {
                targetEl.scrollIntoView({ block: 'start' });
            }
        }

        // "×" = annuler, ne saute pas
        document.getElementById('scrubberClose').addEventListener('click', closeScrubber);

        // Tap à l'extérieur de la liste = confirme et saute à l'espèce actuellement centrée
        scrubberOverlay.addEventListener('click', (e) => {
            if (e.target === scrubberOverlay) {
                const idx = centeredSpeciesIndex();
                jumpToIndex(speciesStartIndex[idx]);
                closeScrubber();
            }
        });

        // Cliquer directement un nom dans la liste saute dessus immédiatement
        picker.addEventListener('click', (e) => {
            const row = e.target.closest('.picker-row');
            if (!row) return;
            const idx = parseInt(row.dataset.index, 10);
            jumpToIndex(speciesStartIndex[idx]);
            closeScrubber();
        });

        // Échap = même effet que la flèche de retour : revient à la galerie de départ, sur la
        // photo actuellement affichée (pas juste en haut de la page)
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                const currentIndex = renderedFrom + Math.round(feed.scrollTop / feed.clientHeight);
                const entry = flatList[currentIndex];
                window.location.href = backUrlFor(entry ? entry.species.scientific : null);
            }
        });

        // Les données ne sont chargées (et le feed construit) qu'une fois le JSON récupéré,
        // en tâche de fond, sans bloquer l'affichage initial de la page
        fetch(DATA_URL)
            .then(r => r.json())
            .then(photosData => {
                buildLists(photosData);
                populateScrubber();

                renderNextBatch();

                // Arrivée depuis la liste des espèces (?s=<index d'espèce>) : sauter directement dessus
                const startSpeciesIdx = parseInt(new URLSearchParams(location.search).get('s'), 10);
                if (!isNaN(startSpeciesIdx) && speciesStartIndex[startSpeciesIdx] !== undefined) {
                    jumpToIndex(speciesStartIndex[startSpeciesIdx]);
                }
            });
    </script>
</body>
</html>
