# --- SECTION HERO / INTRODUCTION ---
intro:
  fr: |
    Je suis astrophysicien à l'Université de Montréal, membre de l'Institut de recherche 
    sur les exoplanètes (iREx). Mes recherches portent sur les naines brunes, les exoplanètes 
    et l'instrumentation astronomique.
  en: |
    I am an astrophysicist at Université de Montréal, member of the Trottier Institute 
    for Research on Exoplanets (iREx). My research focuses on brown dwarfs, exoplanets, 
    and astronomical instrumentation.

# --- SECTION RECHERCHE ---
recherche:
  titre:
    fr: "Mes recherches"
    en: "My Research"
  contenu:
    fr: |
      Je travaille sur la détection et la caractérisation des exoplanètes et des naines brunes 
      dans le voisinage solaire. Je suis responsable scientifique des spectrographes infrarouges 
      NIRPS (installé au télescope de 3.6m de l'ESO au Chili) et SPIRou (au télescope Canada-France-Hawaii).
      
      J'ai développé des techniques innovantes de vélocimétrie de haute précision permettant de 
      détecter des planètes de masse terrestre autour d'étoiles de faible masse. Plus récemment, 
      j'ai mis au point une méthode pour mesurer les variations de température stellaire avec une 
      précision sans précédent.
    en: |
      I work on the detection and characterization of exoplanets and brown dwarfs in the solar 
      neighborhood. I am the scientific lead for the NIRPS infrared spectrograph (installed at 
      ESO's 3.6m telescope in Chile) and SPIRou (at the Canada-France-Hawaii Telescope).
      
      I have developed innovative high-precision velocimetry techniques that enable the detection 
      of Earth-mass planets around low-mass stars. More recently, I developed a method to measure 
      stellar temperature variations with unprecedented precision.

