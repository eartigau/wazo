        /* Cluster personnalisé avec icône caméra */
        .cluster-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            color: #2d5a27;
            border-radius: 50%;
            border: 3px solid white;
            box-shadow: 0 3px 10px rgba(0,0,0,0.3);
            font-weight: 700;
            font-size: 13px;
        }
        .cluster-icon-small {
            width: 40px;
            height: 40px;
        }
        .cluster-icon-medium {
            width: 50px;
            height: 50px;
            font-size: 14px;
        }
        .cluster-icon-large {
            width: 60px;
            height: 60px;
            font-size: 15px;
        }
        /* Marqueur flamant rose individuel */
        .flamingo-marker {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            border-radius: 50%;
            border: 3px solid white;
            box-shadow: 0 3px 10px rgba(0,0,0,0.3);
            font-size: 20px;
            cursor: pointer;
        }
        .flamingo-marker:hover {
            transform: scale(1.1);
        }
        
        /* Badge statut IUCN dans la lightbox */
        .iucn-status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #666;
            margin-top: 8px;
        }
        .iucn-badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 3px;
            text-transform: uppercase;
        }
        .iucn-CR { background: #d32f2f; color: white; }
        .iucn-EN { background: #f57c00; color: white; }
        .iucn-VU { background: #fbc02d; color: #333; }
        .iucn-NT { background: #81c784; color: #333; }
        .iucn-DD { background: #9e9e9e; color: white; }
        .iucn-EW { background: #6a1b9a; color: white; }
        .iucn-EX { background: #000000; color: white; }

        // ========================================
        // GROUPER PAR ESPÈCE (ordre phylogénétique)
        // ========================================
        const speciesMap = {};
        const speciesOrder = []; // Pour garder l'ordre d'apparition (phylogénétique)
        
        photosData.forEach((photo, index) => {
            const sciName = photo.scientific;
            if (!speciesMap[sciName]) {
                speciesMap[sciName] = {
                    scientific: sciName,
                    name_fr: photo.name_fr,
                    name_en: photo.name_en,
                    iucn_status: photo.iucn_status,
                    photos: []
                };
                speciesOrder.push(sciName); // Garder l'ordre d'apparition
            }
            speciesMap[sciName].photos.push({...photo, globalIndex: index});
        });
        
        // Convertir en tableau en gardant l'ordre phylogénétique
        const speciesList = speciesOrder.map(sciName => speciesMap[sciName]);
        
        // ========================================
        // CHARGEMENT PROGRESSIF PAR ESPÈCE
        // ========================================
        const BATCH_SIZE = 24;  // Espèces par lot
        let displayedCount = 0;
        let currentSpecies = null;
        let currentPhotoIndex = 0;
        let map = null;
        let marker = null;
        let activeLocationFilter = null;
        
        function getFilteredSpeciesList() {
            if (!activeLocationFilter) return speciesList;
            
            // Filtrer et recréer la liste avec seulement les photos du lieu
            // Garder l'ordre phylogénétique (pas de tri)
            return speciesList
                .map(sp => ({
                    ...sp,
                    photos: sp.photos.filter(p => p.location === activeLocationFilter)
                }))
                .filter(sp => sp.photos.length > 0);
        }
        
        function createSpeciesCard(species) {
            const card = document.createElement('div');
            card.className = 'species-card';
            card.dataset.species = species.scientific;
            card.style.cursor = 'pointer';
            card.onclick = () => openSpeciesLightbox(species.scientific);
            
            const name = currentLang === 'fr' ? species.name_fr : species.name_en;
            const firstPhoto = species.photos[0];
            const photoCount = species.photos.length;
            const photoLabel = photoCount > 1 
                ? `${photoCount} photos` 
                : '1 photo';
            
            card.innerHTML = `
                <img src="https://cdn.download.ams.birds.cornell.edu/api/v2/asset/${firstPhoto.ml}/480" 
                     alt="${name}"
                     loading="lazy">
                <div class="species-info">
                    <span class="species-common">${name}</span>
                    <span class="species-scientific">${species.scientific}</span>
                    <span class="photo-count">📷 ${photoLabel}</span>
                </div>
            `;
            
            return card;
        }
        
        function renderNextBatch() {
            const grid = document.getElementById('species-grid');
            const loadingIndicator = document.getElementById('loading-indicator');
            
            if (loadingIndicator) {
                loadingIndicator.style.display = 'none';
            }
            
            const filteredList = getFilteredSpeciesList();
            const endIndex = Math.min(displayedCount + BATCH_SIZE, filteredList.length);
            
            for (let i = displayedCount; i < endIndex; i++) {
                const species = filteredList[i];
                const card = createSpeciesCard(species);
                grid.appendChild(card);
            }
            
            displayedCount = endIndex;
            updateLoadMoreButton();
        }
        
        function updateLoadMoreButton() {
            const loadMoreContainer = document.getElementById('load-more-container');
            const remainingCount = document.getElementById('remaining-count');
            const filteredList = getFilteredSpeciesList();
            const remaining = filteredList.length - displayedCount;
            
            if (remaining > 0) {
                loadMoreContainer.style.display = 'block';
                const remainingText = currentLang === 'fr' 
                    ? ` (${remaining} restante${remaining > 1 ? 's' : ''})` 
                    : ` (${remaining} remaining)`;
                remainingCount.textContent = remainingText;
            } else {
                loadMoreContainer.style.display = 'none';
            }
        }
        
        function rebuildGrid() {
            const grid = document.getElementById('species-grid');
            grid.innerHTML = '';
            displayedCount = 0;
            renderNextBatch();
        }
        
        // Charger le premier lot au démarrage
        document.addEventListener('DOMContentLoaded', () => {
            renderNextBatch();
        });
        
        // Auto-charger au scroll
        window.addEventListener('scroll', () => {
            if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 800) {
                const filteredList = getFilteredSpeciesList();
                if (displayedCount < filteredList.length) {
                    renderNextBatch();
                }
            }
        });

        function openSpeciesLightbox(sciName) {
            // Trouver l'espèce (filtrée ou non)
            const filteredList = getFilteredSpeciesList();
            currentSpecies = filteredList.find(sp => sp.scientific === sciName);
            if (!currentSpecies || currentSpecies.photos.length === 0) return;
            
            currentPhotoIndex = 0;
            showCurrentPhoto();
            
            document.getElementById('lightbox').classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        
        function showCurrentPhoto() {
            if (!currentSpecies) return;
            const photo = currentSpecies.photos[currentPhotoIndex];
            if (!photo) return;
            
            // Image pleine résolution
            document.getElementById('lightbox-img').src = 
                `https://cdn.download.ams.birds.cornell.edu/api/v2/asset/${photo.ml}/2400`;
            
            // Cacher la famille (pas demandée)
            document.getElementById('lightbox-family').style.display = 'none';
            
            // Infos
            document.getElementById('lightbox-title').textContent = 
                currentLang === 'fr' ? photo.name_fr : photo.name_en;
            document.getElementById('lightbox-scientific').textContent = photo.scientific;
            
            // Afficher le statut IUCN si l'espèce est menacée
            const iucnDiv = document.getElementById('lightbox-iucn');
            const iucnStatus = currentSpecies.iucn_status || photo.iucn_status;
            if (iucnStatus && iucnStatus !== 'LC' && iucnStatus !== 'NE' && iucnStatus !== '') {
                const statusNames = {
                    'CR': { fr: 'En danger critique', en: 'Critically Endangered' },
                    'CR (PE)': { fr: 'En danger critique', en: 'Critically Endangered' },
                    'CR (PEW)': { fr: 'En danger critique', en: 'Critically Endangered' },
                    'EN': { fr: 'En danger', en: 'Endangered' },
                    'VU': { fr: 'Vulnérable', en: 'Vulnerable' },
                    'NT': { fr: 'Quasi menacé', en: 'Near Threatened' },
                    'DD': { fr: 'Données insuffisantes', en: 'Data Deficient' },
                    'EW': { fr: 'Éteint à l\'état sauvage', en: 'Extinct in the Wild' },
                    'EX': { fr: 'Éteint', en: 'Extinct' }
                };
                const statusCode = iucnStatus.split(' ')[0];
                const statusInfo = statusNames[iucnStatus] || statusNames[statusCode] || { fr: iucnStatus, en: iucnStatus };
                const statusLabel = currentLang === 'fr' ? statusInfo.fr : statusInfo.en;
                iucnDiv.innerHTML = `<span class="iucn-badge iucn-${statusCode}">${statusCode}</span> ${statusLabel}`;
                iucnDiv.style.display = 'flex';
            } else {
                iucnDiv.style.display = 'none';
            }
            
            document.getElementById('lightbox-location').textContent = 
                currentLang === 'fr' ? photo.location_fr : photo.location_en;
            document.getElementById('lightbox-date').innerHTML = 
                currentLang === 'fr' ? photo.date_fr : photo.date_en;
            document.getElementById('lightbox-ebird').href = 
                `https://ebird.org/checklist/${photo.checklist_id}`;
            
            // Compteur de photos
            const counterEl = document.getElementById('lightbox-counter');
            if (counterEl) {
                if (currentSpecies.photos.length > 1) {
                    counterEl.textContent = `${currentPhotoIndex + 1} / ${currentSpecies.photos.length}`;
                    counterEl.style.display = 'block';
                } else {
                    counterEl.style.display = 'none';
                }
            }

            // Carte - cachée sur mobile
            const mapDiv = document.getElementById('lightbox-map');
            const isMobile = window.innerWidth <= 768;
            
            if (photo.lat && photo.lng && !isMobile) {
                mapDiv.style.display = 'block';
                
                if (!map) {
                    map = L.map('lightbox-map', {
                        zoomControl: false,
                        attributionControl: false
                    });
                    
                    // Tile layer selon la langue
                    
                    L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png', {
                        maxZoom: 19,
                        attribution: '© OpenStreetMap France'
                    }).addTo(map);
                    
                }
                
                map.setView([photo.lat, photo.lng], 8);
                
                const flamingoIcon = L.divIcon({
                    className: '',
                    html: '<div class="flamingo-marker">🦩</div>',
                    iconSize: [36, 36],
                    iconAnchor: [18, 18]
                });
                
                if (marker) {
                    marker.setLatLng([photo.lat, photo.lng]);
                } else {
                    marker = L.marker([photo.lat, photo.lng], { icon: flamingoIcon }).addTo(map);
                }
                
                setTimeout(() => map.invalidateSize(), 100);
            } else {
                mapDiv.style.display = 'none';
            }
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.body.style.overflow = '';
        }

        function navigateLightbox(direction) {
            if (!currentSpecies) return;
            const total = currentSpecies.photos.length;
            currentPhotoIndex = (currentPhotoIndex + direction + total) % total;
            showCurrentPhoto();
        }

        // Clavier
        document.addEventListener('keydown', (e) => {
            if (!document.getElementById('lightbox').classList.contains('active')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') navigateLightbox(-1);
            if (e.key === 'ArrowRight') navigateLightbox(1);
        });

        // Clic hors contenu pour fermer
        document.getElementById('lightbox').addEventListener('click', (e) => {
            if (e.target.id === 'lightbox') closeLightbox();
        });

        // Ouvrir une photo par ML number (pour liens depuis liste espèces)
        function openPhotoByML(ml) {
            // Trouver l'espèce qui contient cette photo
            for (const species of speciesList) {
                const photoIndex = species.photos.findIndex(p => p.ml === ml);
                if (photoIndex >= 0) {
                    currentSpecies = species;
                    currentPhotoIndex = photoIndex;
                    showCurrentPhoto();
                    document.getElementById('lightbox').classList.add('active');
                    document.body.style.overflow = 'hidden';
                    return;
                }
            }
        }

        // Vérifier si URL contient un paramètre photo
        window.addEventListener('load', () => {
            const params = new URLSearchParams(window.location.search);
            const ml = params.get('photo');
            if (ml) {
                openPhotoByML(ml);
            }
        });

        
        
        // Menu mobile hamburger
        function toggleMobileMenu() {
            document.getElementById('navMenu').classList.toggle('active');
        }
        
        // Fermer menu au clic ailleurs
        document.addEventListener('click', (e) => {
            const nav = document.querySelector('nav');
            const menu = document.getElementById('navMenu');
            if (menu && !nav.contains(e.target)) {
                menu.classList.remove('active');
            }
        });
        
        // Swipe pour lightbox sur mobile
        let touchStartX = 0;
        let touchEndX = 0;
        
        document.getElementById('lightbox').addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });
        
        document.getElementById('lightbox').addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, { passive: true });
        
        function handleSwipe() {
            const diff = touchStartX - touchEndX;
            if (Math.abs(diff) > 50) {
                if (diff > 0) {
                    navigateLightbox(1); // Swipe gauche = suivant
                } else {
                    navigateLightbox(-1); // Swipe droite = précédent
                }
            }
        }
    </script>
</body>
</html>
