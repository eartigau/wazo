                name_en: "Loggerhead Shrike",
                scientific: "Lanius ludovicianus",
                family: "Laniidae (Shrikes)",
                location: "Saratoga Lake Park",
                location_fr: "Saratoga Lake Park, Floride, États-Unis",
                location_en: "Saratoga Lake Park, Florida, United States",
                date_fr: "25 février 2024",
                date_en: "February 25<sup>th</sup>, 2024",
                lat: 26.6432561,
                lng: -81.9704747,
                checklist_id: "S162904814"
            }
            
        ];

        // ========================================
        // GROUPER PAR ESPÈCE
        // ========================================
        const speciesMap = {};
        photosData.forEach((photo, index) => {
            const sciName = photo.scientific;
            if (!speciesMap[sciName]) {
                speciesMap[sciName] = {
                    scientific: sciName,
                    name_fr: photo.name_fr,
                    name_en: photo.name_en,
                    photos: []
                };
            }
            speciesMap[sciName].photos.push({...photo, globalIndex: index});
        });
        
        // Convertir en tableau et trier par nombre de photos décroissant
        const speciesList = Object.values(speciesMap).sort((a, b) => b.photos.length - a.photos.length);
        
        // ========================================
        // CHARGEMENT PROGRESSIF PAR ESPÈCE
        // ========================================
        const BATCH_SIZE = 24;  // Espèces par lot
        let displayedCount = 0;
        let currentSpecies = null;
        let currentPhotoIndex = 0;
        let map = null;
        let marker = null;
        let activeLocationFilter = null;
        
        function getFilteredSpeciesList() {
            if (!activeLocationFilter) return speciesList;
            
            // Filtrer et recréer la liste avec seulement les photos du lieu
            return speciesList
                .map(sp => ({
                    ...sp,
                    photos: sp.photos.filter(p => p.location === activeLocationFilter)
                }))
                .filter(sp => sp.photos.length > 0)
                .sort((a, b) => b.photos.length - a.photos.length);
        }
        
        function createSpeciesCard(species) {
            const card = document.createElement('div');
            card.className = 'species-card';
            card.dataset.species = species.scientific;
            card.style.cursor = 'pointer';
            card.onclick = () => openSpeciesLightbox(species.scientific);
            
            const name = currentLang === 'fr' ? species.name_fr : species.name_en;
            const firstPhoto = species.photos[0];
            const photoCount = species.photos.length;
            const photoLabel = photoCount > 1 
                ? `${photoCount} photos` 
                : '1 photo';
            
            card.innerHTML = `
                <img src="https://cdn.download.ams.birds.cornell.edu/api/v2/asset/${firstPhoto.ml}/480" 
                     alt="${name}"
                     loading="lazy">
                <div class="species-info">
                    <span class="species-common">${name}</span>
                    <span class="species-scientific">${species.scientific}</span>
                    <span class="photo-count">📷 ${photoLabel}</span>
                </div>
            `;
            
            return card;
        }
        
        function renderNextBatch() {
            const grid = document.getElementById('species-grid');
            const loadingIndicator = document.getElementById('loading-indicator');
            
            if (loadingIndicator) {
                loadingIndicator.style.display = 'none';
            }
            
            const filteredList = getFilteredSpeciesList();
            const endIndex = Math.min(displayedCount + BATCH_SIZE, filteredList.length);
            
            for (let i = displayedCount; i < endIndex; i++) {
                const species = filteredList[i];
                const card = createSpeciesCard(species);
                grid.appendChild(card);
            }
            
            displayedCount = endIndex;
            updateLoadMoreButton();
        }
        
        function updateLoadMoreButton() {
            const loadMoreContainer = document.getElementById('load-more-container');
            const remainingCount = document.getElementById('remaining-count');
            const filteredList = getFilteredSpeciesList();
            const remaining = filteredList.length - displayedCount;
            
            if (remaining > 0) {
                loadMoreContainer.style.display = 'block';
                const remainingText = currentLang === 'fr' 
                    ? ` (${remaining} restante${remaining > 1 ? 's' : ''})` 
                    : ` (${remaining} remaining)`;
                remainingCount.textContent = remainingText;
            } else {
                loadMoreContainer.style.display = 'none';
            }
        }
        
        function rebuildGrid() {
            const grid = document.getElementById('species-grid');
            grid.innerHTML = '';
            displayedCount = 0;
            renderNextBatch();
        }
        
        // Charger le premier lot au démarrage
        document.addEventListener('DOMContentLoaded', () => {
            renderNextBatch();
        });
        
        // Auto-charger au scroll
        window.addEventListener('scroll', () => {
            if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 800) {
                const filteredList = getFilteredSpeciesList();
                if (displayedCount < filteredList.length) {
                    renderNextBatch();
                }
            }
        });

        function openSpeciesLightbox(sciName) {
            // Trouver l'espèce (filtrée ou non)
            const filteredList = getFilteredSpeciesList();
            currentSpecies = filteredList.find(sp => sp.scientific === sciName);
            if (!currentSpecies || currentSpecies.photos.length === 0) return;
            
            currentPhotoIndex = 0;
            showCurrentPhoto();
            
            document.getElementById('lightbox').classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        
        function showCurrentPhoto() {
            if (!currentSpecies) return;
            const photo = currentSpecies.photos[currentPhotoIndex];
            if (!photo) return;
            
            // Image pleine résolution
            document.getElementById('lightbox-img').src = 
                `https://cdn.download.ams.birds.cornell.edu/api/v2/asset/${photo.ml}/2400`;
            
            // Cacher la famille (pas demandée)
            document.getElementById('lightbox-family').style.display = 'none';
            
            // Infos
            document.getElementById('lightbox-title').textContent = 
                currentLang === 'fr' ? photo.name_fr : photo.name_en;
            document.getElementById('lightbox-scientific').textContent = photo.scientific;
            document.getElementById('lightbox-location').textContent = 
                currentLang === 'fr' ? photo.location_fr : photo.location_en;
            document.getElementById('lightbox-date').innerHTML = 
                currentLang === 'fr' ? photo.date_fr : photo.date_en;
            document.getElementById('lightbox-ebird').href = 
                `https://ebird.org/checklist/${photo.checklist_id}`;
            
            // Compteur de photos
            const counterEl = document.getElementById('lightbox-counter');
            if (counterEl) {
                if (currentSpecies.photos.length > 1) {
                    counterEl.textContent = `${currentPhotoIndex + 1} / ${currentSpecies.photos.length}`;
                    counterEl.style.display = 'block';
                } else {
                    counterEl.style.display = 'none';
                }
            }

            // Carte - cachée sur mobile
            const mapDiv = document.getElementById('lightbox-map');
            const isMobile = window.innerWidth <= 768;
            
            if (photo.lat && photo.lng && !isMobile) {
                mapDiv.style.display = 'block';
                
                if (!map) {
                    map = L.map('lightbox-map', {
                        zoomControl: false,
                        attributionControl: false
                    });
                    
                    // Thème nature - CartoDB Voyager
                    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                        subdomains: 'abcd',
                        maxZoom: 19
                    }).addTo(map);
                }
                
                map.setView([photo.lat, photo.lng], 8);
                
                const flamingoIcon = L.divIcon({
                    className: '',
                    html: '<div class="flamingo-marker">🦩</div>',
                    iconSize: [36, 36],
                    iconAnchor: [18, 18]
                });
                
                if (marker) {
                    marker.setLatLng([photo.lat, photo.lng]);
                } else {
                    marker = L.marker([photo.lat, photo.lng], { icon: flamingoIcon }).addTo(map);
                }
                
                setTimeout(() => map.invalidateSize(), 100);
            } else {
                mapDiv.style.display = 'none';
            }
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.body.style.overflow = '';
        }

        function navigateLightbox(direction) {
            if (!currentSpecies) return;
            const total = currentSpecies.photos.length;
            currentPhotoIndex = (currentPhotoIndex + direction + total) % total;
            showCurrentPhoto();
        }

        // Clavier
        document.addEventListener('keydown', (e) => {
            if (!document.getElementById('lightbox').classList.contains('active')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') navigateLightbox(-1);
            if (e.key === 'ArrowRight') navigateLightbox(1);
        });

        // Clic hors contenu pour fermer
        document.getElementById('lightbox').addEventListener('click', (e) => {
            if (e.target.id === 'lightbox') closeLightbox();
        });

        // Ouvrir une photo par ML number (pour liens depuis liste espèces)
        function openPhotoByML(ml) {
            // Trouver l'espèce qui contient cette photo
            for (const species of speciesList) {
                const photoIndex = species.photos.findIndex(p => p.ml === ml);
                if (photoIndex >= 0) {
                    currentSpecies = species;
                    currentPhotoIndex = photoIndex;
                    showCurrentPhoto();
                    document.getElementById('lightbox').classList.add('active');
                    document.body.style.overflow = 'hidden';
                    return;
                }
            }
        }

        // Vérifier si URL contient un paramètre photo
        window.addEventListener('load', () => {
            const params = new URLSearchParams(window.location.search);
            const ml = params.get('photo');
            if (ml) {
                openPhotoByML(ml);
            }
        });

        
        // Carte du voyage avec filtrage par lieu
        const tripLocations = [
            
            { lat: 25.3820583, lng: -80.6069362, name: "Everglades NP" },
            
            { lat: 25.783585, lng: -80.3782082, name: "Dolphin Mall" },
            
            { lat: 25.4034735, lng: -80.5586135, name: "Southern Glades Trail (C111 Canal outside ENP)" },
            
            { lat: 25.396439, lng: -80.566581, name: "Frog Pond WMA" },
            
            { lat: 26.375442, lng: -81.6040206, name: "Audubon Corkscrew Swamp Sanctuary" },
            
            { lat: 26.4510559, lng: -82.1234035, name: "J. N. Ding Darling NWR" },
            
            { lat: 26.8582653, lng: -81.9401121, name: "Babcock-Webb WMA" },
            
            { lat: 26.5093477, lng: -82.0254493, name: "Skimmer Island" },
            
            { lat: 26.5436559, lng: -81.950841, name: "Cape Coral Marina" },
            
            { lat: 26.6432561, lng: -81.9704747, name: "Saratoga Lake Park" },
            
        ];
        
        // Compter les photos par lieu
        function countPhotosByLocation(locationName) {
            return photosData.filter(p => p.location === locationName).length;
        }
        
        // Compter les espèces par lieu
        function countSpeciesByLocation(locationName) {
            const speciesSet = new Set();
            photosData.filter(p => p.location === locationName).forEach(p => speciesSet.add(p.scientific));
            return speciesSet.size;
        }
        
        // Filtrer par lieu - reconstruit la grille avec les espèces filtrées
        function filterByLocation(locationName) {
            activeLocationFilter = locationName;
            
            // Reconstruire la grille avec les espèces filtrées
            rebuildGrid();
            
            // Compter les espèces et photos du lieu
            const filteredList = getFilteredSpeciesList();
            const speciesCount = filteredList.length;
            const photoCount = filteredList.reduce((sum, sp) => sum + sp.photos.length, 0);
            
            // Afficher l'indicateur de filtre
            const indicator = document.getElementById('location-filter-indicator');
            const locationNameSpan = document.getElementById('filter-location-name');
            const photoCountSpan = document.getElementById('filter-photo-count');
            
            if (indicator) {
                locationNameSpan.textContent = locationName;
                const statsText = currentLang === 'fr' 
                    ? ` (${speciesCount} espèce${speciesCount > 1 ? 's' : ''}, ${photoCount} photo${photoCount > 1 ? 's' : ''})` 
                    : ` (${speciesCount} species, ${photoCount} photo${photoCount > 1 ? 's' : ''})`;
                photoCountSpan.textContent = statsText;
                indicator.style.display = 'flex';
            }
            
            // Scroll vers la grille
            document.querySelector('.gallery-container').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
        
        // Réinitialiser le filtre
        function resetLocationFilter() {
            activeLocationFilter = null;
            
            // Reconstruire la grille sans filtre
            rebuildGrid();
            
            const indicator = document.getElementById('location-filter-indicator');
            if (indicator) {
                indicator.style.display = 'none';
            }
        }

        if (tripLocations.length > 0) {
            // Créer la carte
            const tripMap = L.map('trip-map', {
                scrollWheelZoom: false,
                zoomControl: true
            });

            // Thème nature - CartoDB Voyager (fiable et coloré)
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                attribution: '© OpenStreetMap © CARTO',
                subdomains: 'abcd',
                maxZoom: 19
            }).addTo(tripMap);

            // Icône flamant rose pour les marqueurs individuels
            function createFlamingoIcon() {
                return L.divIcon({
                    html: '<div class="flamingo-marker">🦩</div>',
                    className: '',
                    iconSize: [36, 36],
                    iconAnchor: [18, 18],
                    popupAnchor: [0, -18]
                });
            }

            // Créer le cluster group avec icônes personnalisés
            const markerCluster = L.markerClusterGroup({
                maxClusterRadius: 50,
                spiderfyOnMaxZoom: true,
                showCoverageOnHover: false,
                zoomToBoundsOnClick: true,
                iconCreateFunction: function(cluster) {
                    const count = cluster.getChildCount();
                    let sizeClass = 'cluster-icon-small';
                    if (count >= 10) sizeClass = 'cluster-icon-medium';
                    if (count >= 25) sizeClass = 'cluster-icon-large';
                    
                    return L.divIcon({
                        html: `<div class="cluster-icon ${sizeClass}">📷 ${count}</div>`,
                        className: '',
                        iconSize: [50, 50],
                        iconAnchor: [25, 25]
                    });
                }
            });

            // Ajouter les marqueurs avec compte de photos et filtrage
            tripLocations.forEach(loc => {
                const marker = L.marker([loc.lat, loc.lng], { icon: createFlamingoIcon() });
                const photoCount = countPhotosByLocation(loc.name);
                
                if (loc.name) {
                    // Popup avec nom et compte de photos
                    const popupContent = `
                        <div class="trip-popup-content">
                            <strong>${loc.name}</strong>
                            <div class="popup-photo-count">${photoCount} photo${photoCount > 1 ? 's' : ''}</div>
                            <button class="popup-filter-btn" onclick="filterByLocation('${loc.name.replace(/'/g, "\\'")}')">
                                ${currentLang === 'fr' ? 'Voir ces photos' : 'View photos'}
                            </button>
                        </div>
                    `;
                    marker.bindPopup(popupContent, { className: 'trip-popup' });
                }
                
                markerCluster.addLayer(marker);
            });

            tripMap.addLayer(markerCluster);

            // Ajuster la vue pour montrer tous les marqueurs
            if (tripLocations.length > 0) {
                tripMap.fitBounds(markerCluster.getBounds().pad(0.1));
                
                // Limiter le zoom max pour garder du contexte
                if (tripMap.getZoom() > 12) {
                    tripMap.setZoom(12);
                }
            }
        }
        
        
        // Menu mobile hamburger
        function toggleMobileMenu() {
            document.getElementById('navMenu').classList.toggle('active');
        }
        
        // Fermer menu au clic ailleurs
        document.addEventListener('click', (e) => {
            const nav = document.querySelector('nav');
            const menu = document.getElementById('navMenu');
            if (menu && !nav.contains(e.target)) {
                menu.classList.remove('active');
            }
        });
        
        // Swipe pour lightbox sur mobile
        let touchStartX = 0;
        let touchEndX = 0;
        
        document.getElementById('lightbox').addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });
        
        document.getElementById('lightbox').addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, { passive: true });
        
        function handleSwipe() {
            const diff = touchStartX - touchEndX;
            if (Math.abs(diff) > 50) {
                if (diff > 0) {
                    navigateLightbox(1); // Swipe gauche = suivant
                } else {
                    navigateLightbox(-1); // Swipe droite = précédent
                }
            }
        }
    </script>
</body>
</html>
