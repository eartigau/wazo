<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>Admin - Curation des photos</title>
    <style>
        :root {
            --bg: #1a1a2e;
            --bg-card: #16213e;
            --accent: #0f3460;
            --highlight: #e94560;
            --success: #4ade80;
            --warning: #fbbf24;
            --text: #eee;
            --text-dim: #888;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 80px;
        }
        
        .header {
            position: sticky;
            top: 0;
            background: var(--bg);
            padding: 20px;
            border-bottom: 1px solid var(--accent);
            z-index: 100;
        }
        
        .header h1 {
            font-size: 20px;
            margin-bottom: 16px;
            color: var(--highlight);
        }
        
        .toolbar {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .search-box {
            flex: 1;
            min-width: 200px;
            padding: 10px 16px;
            border: 1px solid var(--accent);
            border-radius: 8px;
            background: var(--bg-card);
            color: var(--text);
            font-size: 16px; /* Empêche zoom iOS */
        }
        
        .search-box:focus {
            outline: none;
            border-color: var(--highlight);
        }
        
        .filter-group {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .filter-label {
            color: var(--text-dim);
            font-size: 13px;
        }
        
        .filter-btn {
            padding: 8px 14px;
            border: 1px solid var(--accent);
            border-radius: 6px;
            background: var(--bg-card);
            color: var(--text);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            min-height: 44px;
        }
        
        .filter-btn:hover {
            border-color: var(--highlight);
        }
        
        .filter-btn.active {
            background: var(--highlight);
            border-color: var(--highlight);
        }
        
        .stats-bar {
            display: flex;
            gap: 16px;
            padding: 12px 20px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--accent);
            flex-wrap: wrap;
        }
        
        .stat-item {
            font-size: 14px;
            color: var(--text-dim);
        }
        
        .stat-item span {
            color: var(--text);
            font-weight: 600;
        }
        
        .stat-best span { color: var(--warning); }
        .stat-include span { color: var(--success); }
        .stat-reject span { color: var(--highlight); }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            padding: 20px;
        }
        
        .card {
            background: var(--bg-card);
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid transparent;
            transition: all 0.2s;
        }
        
        .card.status-best {
            border-color: var(--warning);
        }
        
        .card.status-reject {
            opacity: 0.5;
        }
        
        .card-image {
            position: relative;
            aspect-ratio: 1;
            cursor: pointer;
            overflow: hidden;
        }
        
        .card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }
        
        .card-image:hover img {
            transform: scale(1.05);
        }
        
        .ml-badge {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background: rgba(0,0,0,0.8);
            color: var(--warning);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-family: monospace;
        }
        
        .card-info {
            padding: 12px;
        }
        
        .card-name {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .card-sci {
            font-size: 12px;
            color: var(--text-dim);
            font-style: italic;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .card-date {
            font-size: 11px;
            color: var(--text-dim);
            margin-bottom: 10px;
        }
        
        .curation-btns {
            display: flex;
            gap: 6px;
        }
        
        .curation-btn {
            flex: 1;
            padding: 8px 4px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--accent);
            min-height: 44px;
        }
        
        .curation-btn:hover {
            transform: scale(1.1);
        }
        
        .curation-btn.active.best {
            background: var(--warning);
        }
        
        .curation-btn.active.include {
            background: var(--success);
        }
        
        .curation-btn.active.reject {
            background: var(--highlight);
        }
        
        /* Footer fixe */
        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-card);
            padding: 16px 20px;
            border-top: 1px solid var(--accent);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            gap: 12px;
        }
        
        .changes-count {
            font-size: 14px;
            color: var(--text-dim);
        }
        
        .download-btn {
            padding: 12px 24px;
            background: var(--success);
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            min-height: 44px;
        }
        
        .download-btn:hover {
            transform: scale(1.05);
        }
        
        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--bg-card);
            color: var(--text);
            padding: 12px 24px;
            border-radius: 8px;
            border: 1px solid var(--accent);
            opacity: 0;
            transition: all 0.3s;
            z-index: 1000;
        }
        
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        
        /* Chargement progressif */
        .loading-indicator {
            text-align: center;
            padding: 40px;
            color: var(--text-dim);
            font-size: 16px;
        }
        
        .load-more-container {
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        
        .load-more-btn {
            padding: 14px 28px;
            background: var(--highlight);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            min-height: 44px;
        }
        
        .load-more-btn:hover {
            transform: scale(1.05);
        }
        
        /* Mobile responsive */
        @media (max-width: 600px) {
            .header {
                padding: 16px;
            }
            
            .header h1 {
                font-size: 18px;
                margin-bottom: 12px;
            }
            
            .toolbar {
                gap: 10px;
            }
            
            .search-box {
                min-width: 100%;
                order: -1;
            }
            
            .filter-group {
                width: 100%;
                justify-content: flex-start;
            }
            
            .filter-btn {
                padding: 8px 10px;
                font-size: 12px;
            }
            
            .stats-bar {
                gap: 12px;
                padding: 10px 16px;
            }
            
            .stat-item {
                font-size: 13px;
            }
            
            .grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
                padding: 12px;
            }
            
            .card-info {
                padding: 10px;
            }
            
            .card-name {
                font-size: 13px;
            }
            
            .ml-badge {
                font-size: 10px;
                padding: 3px 6px;
            }
            
            .footer {
                padding: 12px 16px;
            }
            
            .changes-count {
                font-size: 12px;
            }
            
            .download-btn {
                padding: 10px 16px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📷 Curation des photos</h1>
        <div class="toolbar">
            <input type="text" class="search-box" id="searchBox" placeholder="Rechercher (nom, ML#)...">
            <div class="filter-group">
                <span class="filter-label">Statut:</span>
                <button class="filter-btn active" data-filter="all">Tout</button>
                <button class="filter-btn" data-filter="best">⭐</button>
                <button class="filter-btn" data-filter="include">✓</button>
                <button class="filter-btn" data-filter="reject">✗</button>
            </div>
        </div>
    </div>
    
    <div class="stats-bar">
        <span class="stat-item">📷 <span id="count-total">0</span></span>
        <span class="stat-item stat-best">⭐ <span id="count-best">0</span></span>
        <span class="stat-item stat-include">✓ <span id="count-include">0</span></span>
        <span class="stat-item stat-reject">✗ <span id="count-reject">0</span></span>
        <span class="stat-item" id="displayed-count" style="margin-left: auto;"></span>
    </div>
    
    <div class="grid" id="photoGrid">
        <div class="loading-indicator" id="loading-indicator">Chargement...</div>
    </div>
    
    <div class="load-more-container" id="load-more-container" style="display: none;">
        <button class="load-more-btn" id="load-more-btn" onclick="renderNextBatch()">
            Afficher plus <span id="remaining-count"></span>
        </button>
    </div>
    
    <div class="footer">
        <span class="changes-count"><span id="changesCount">0</span> modification(s)</span>
        <button class="download-btn" id="downloadBtn" onclick="downloadCSV()">
            📥 Télécharger CSV
        </button>
    </div>
    
    <div class="toast" id="toast">ML# copié!</div>

    <script>
        const BATCH_SIZE = 80;
        
        // Données des photos
        const allPhotosData = [
            {% for photo in photos %}
            {
                ml: "{{ photo.ml_catalog_number }}",
                nameFr: "{{ photo.common_name_fr|replace('\\', '\\\\')|replace('"', '\\"') }}",
                nameEn: "{{ photo.common_name_en|replace('\\', '\\\\')|replace('"', '\\"') }}",
                sciName: "{{ photo.scientific_name|replace('\\', '\\\\')|replace('"', '\\"') }}",
                date: "{{ photo.date_raw }}",
                status: "{{ photo.status }}"
            }{% if not loop.last %},{% endif %}
            {% endfor %}
        ];
        
        // État
        let curationData = {};
        let displayedCount = 0;
        let filteredPhotos = [...allPhotosData];
        let changesCount = 0;
        let currentFilter = 'all';
        let currentSearch = '';
        
        // Initialiser curationData
        allPhotosData.forEach(p => {
            curationData[p.ml] = p.status;
        });
        
        // Créer une carte photo
        function createPhotoCard(photo) {
            const card = document.createElement('div');
            card.className = 'card status-' + curationData[photo.ml];
            card.dataset.ml = photo.ml;
            card.dataset.name = (photo.nameFr + ' ' + photo.nameEn + ' ' + photo.sciName).toLowerCase();
            card.dataset.status = curationData[photo.ml];
            
            card.innerHTML = `
                <div class="card-image" onclick="copyML('${photo.ml}')">
                    <img src="https://cdn.download.ams.birds.cornell.edu/api/v2/asset/${photo.ml}/480" 
                         alt="${photo.nameFr}" loading="lazy">
                    <span class="ml-badge">${photo.ml}</span>
                </div>
                <div class="card-info">
                    <div class="card-name">${photo.nameFr}</div>
                    <div class="card-sci">${photo.sciName}</div>
                    <div class="card-date">${photo.date}</div>
                    <div class="curation-btns">
                        <button class="curation-btn ${curationData[photo.ml] === 'best' ? 'active best' : ''}" 
                                onclick="setStatus(this, 'best')" title="Meilleure photo">⭐</button>
                        <button class="curation-btn ${curationData[photo.ml] === 'include' ? 'active include' : ''}" 
                                onclick="setStatus(this, 'include')" title="Inclure">✓</button>
                        <button class="curation-btn ${curationData[photo.ml] === 'reject' ? 'active reject' : ''}" 
                                onclick="setStatus(this, 'reject')" title="Rejeter">✗</button>
                    </div>
                </div>
            `;
            
            return card;
        }
        
        // Rendre le prochain batch
        function renderNextBatch() {
            const grid = document.getElementById('photoGrid');
            const loadingIndicator = document.getElementById('loading-indicator');
            
            if (loadingIndicator) {
                loadingIndicator.style.display = 'none';
            }
            
            const toRender = filteredPhotos.slice(displayedCount, displayedCount + BATCH_SIZE);
            
            toRender.forEach(photo => {
                const card = createPhotoCard(photo);
                grid.appendChild(card);
            });
            
            displayedCount += toRender.length;
            updateLoadMoreButton();
            updateDisplayedCount();
        }
        
        function updateLoadMoreButton() {
            const container = document.getElementById('load-more-container');
            const remaining = filteredPhotos.length - displayedCount;
            
            if (remaining > 0) {
                container.style.display = 'flex';
                document.getElementById('remaining-count').textContent = ` (${remaining} restantes)`;
            } else {
                container.style.display = 'none';
            }
        }
        
        function updateDisplayedCount() {
            const el = document.getElementById('displayed-count');
            if (displayedCount < filteredPhotos.length) {
                el.textContent = `Affiché: ${displayedCount}/${filteredPhotos.length}`;
            } else {
                el.textContent = '';
            }
        }
        
        function clearGrid() {
            const grid = document.getElementById('photoGrid');
            const cards = grid.querySelectorAll('.card');
            cards.forEach(c => c.remove());
            displayedCount = 0;
        }
        
        // Filtrer et re-rendre
        function applyFilters() {
            currentSearch = document.getElementById('searchBox').value.toLowerCase();
            
            filteredPhotos = allPhotosData.filter(photo => {
                const matchesSearch = currentSearch === '' || 
                    photo.nameFr.toLowerCase().includes(currentSearch) ||
                    photo.nameEn.toLowerCase().includes(currentSearch) ||
                    photo.sciName.toLowerCase().includes(currentSearch) ||
                    photo.ml.includes(currentSearch);
                
                const status = curationData[photo.ml];
                const matchesFilter = currentFilter === 'all' || status === currentFilter;
                
                return matchesSearch && matchesFilter;
            });
            
            clearGrid();
            renderNextBatch();
            updateStats();
        }
        
        // Copier le numéro ML
        function copyML(ml) {
            navigator.clipboard.writeText(ml).then(() => {
                showToast('ML# ' + ml + ' copié!');
            });
        }
        
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }
        
        // Changer le statut d'une photo
        function setStatus(btn, status) {
            const card = btn.closest('.card');
            const ml = card.dataset.ml;
            const oldStatus = curationData[ml];
            
            if (oldStatus !== status) {
                changesCount++;
                document.getElementById('changesCount').textContent = changesCount;
            }
            
            // Mettre à jour les données
            curationData[ml] = status;
            card.dataset.status = status;
            
            // Mettre à jour les classes
            card.className = 'card status-' + status;
            
            // Mettre à jour les boutons
            card.querySelectorAll('.curation-btn').forEach(b => {
                b.classList.remove('active', 'best', 'include', 'reject');
            });
            btn.classList.add('active', status);
            
            // Mettre à jour les compteurs
            updateStats();
            
            // Réappliquer les filtres si nécessaire (cacher si ne correspond plus)
            if (currentFilter !== 'all' && status !== currentFilter) {
                card.style.display = 'none';
            }
        }
        
        // Mettre à jour les statistiques
        function updateStats() {
            let total = allPhotosData.length;
            let best = 0, include = 0, reject = 0;
            
            for (const [ml, status] of Object.entries(curationData)) {
                if (status === 'best') best++;
                else if (status === 'include') include++;
                else if (status === 'reject') reject++;
            }
            
            document.getElementById('count-total').textContent = total;
            document.getElementById('count-best').textContent = best;
            document.getElementById('count-include').textContent = include;
            document.getElementById('count-reject').textContent = reject;
        }
        
        // Recherche
        document.getElementById('searchBox').addEventListener('input', applyFilters);
        
        // Filtres de statut
        document.querySelectorAll('.filter-btn[data-filter]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn[data-filter]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                applyFilters();
            });
        });
        
        // Télécharger le CSV
        function downloadCSV() {
            let csv = 'ml_number,status\n';
            for (const [ml, status] of Object.entries(curationData)) {
                csv += `${ml},${status}\n`;
            }
            
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'photo_curation.csv';
            a.click();
            URL.revokeObjectURL(url);
            
            showToast('CSV téléchargé!');
        }
        
        // Scroll infini
        let scrollTimeout;
        window.addEventListener('scroll', () => {
            if (scrollTimeout) clearTimeout(scrollTimeout);
            scrollTimeout = setTimeout(() => {
                if ((window.innerHeight + window.scrollY) >= (document.body.offsetHeight - 800)) {
                    if (displayedCount < filteredPhotos.length) {
                        renderNextBatch();
                    }
                }
            }, 100);
        });
        
        // Initialisation
        document.addEventListener('DOMContentLoaded', () => {
            updateStats();
            renderNextBatch();
        });
    </script>
</body>
</html>
