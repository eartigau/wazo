# ==============================================================================
# CONFIGURATION GALERIE eBIRD v2.0
# ==============================================================================
# Ce fichier contient tous les paramètres configurables de la galerie.
# Modifiez-le selon vos besoins.
# ==============================================================================


# ------------------------------------------------------------------------------
# FICHIERS SOURCE
# ------------------------------------------------------------------------------
fichiers:
  # Données eBird exportées (télécharger depuis https://ebird.org/downloadMyData)
  donnees_ebird: "MyEBirdData.csv"
  
  # Taxonomie eBird (télécharger depuis https://ebird.org/science/use-ebird-data/the-ebird-taxonomy)
  # Mettre à jour annuellement (ex: eBird_taxonomy_v2026.csv)
  taxonomie: "eBird_taxonomy_v2025.csv"
  
  # Cache des vérifications de médias (généré automatiquement)
  cache_medias: "media_cache.csv"
  
  # Traductions des noms de lieux
  traductions_lieux: "traductions_lieux.csv"
  
  # Curation des photos (généré via la page admin)
  # Contient les statuts: best, include, reject
  curation: "photo_curation.csv"


# ------------------------------------------------------------------------------
# SITE WEB
# ------------------------------------------------------------------------------
site:
  # Page d'accueil (sera ajoutée au menu)
  index_fr: "https://eartigau.github.io/page_perso/index_fr.html"
  index_en: "https://eartigau.github.io/page_perso/index_en.html"
  
  # Titre du site (utilisé dans les métadonnées)
  titre_fr: "Galerie Photos d'Oiseaux"
  titre_en: "Bird Photo Gallery"
  
  # Auteur/Copyright
  auteur: "Étienne Artigau"


# ------------------------------------------------------------------------------
# OPTIONS DE GÉNÉRATION
# ------------------------------------------------------------------------------
generation:
  # Vérifier les médias en ligne (plus lent mais plus précis)
  # Mettre à false pour accélérer la génération si le cache est à jour
  verifier_medias_en_ligne: false
  
  # Limite par défaut de photos par galerie
  limite_photos_defaut: 300
  
  # Nombre de photos pour "Ajouts récents" (minimum ou période de 3 mois)
  ajouts_recents_minimum: 50
  
  # Limite de photos pour les galeries par famille
  limite_photos_famille: 500


# ------------------------------------------------------------------------------
# VOYAGES
# ------------------------------------------------------------------------------
# Chaque voyage génère une galerie avec les photos des lieux spécifiés.
#
# Paramètres:
#   id: Identifiant unique (utilisé pour les noms de fichiers)
#   nom_fr/nom_en: Nom affiché
#   pays: Liste de codes pays/régions eBird (ex: CA-QC, US-FL, CL, CH)
#   regions: (optionnel) Liste de régions spécifiques
#   date_debut/date_fin: (optionnel) Filtrer par période (format YYYY-MM-DD)
#   limite: (optionnel) Nombre max de photos (défaut: limite_photos_defaut)
#
# NOTE: L'image de couverture (frontispice) est déterminée automatiquement
# par la curation. Utilisez la page admin pour marquer une photo comme "best".
# ------------------------------------------------------------------------------

