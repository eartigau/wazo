        // Calcule et fixe la taille exacte (en px) de l'image pour qu'elle tienne dans son
        // conteneur en respectant son ratio, sans dépendre de l'algorithme du navigateur :
        // Safari ne gère pas toujours bien width:auto/height:auto + max-width/max-height
        // sur un enfant flex (il ignore parfois max-height), ce qui rognait certaines
        // photos portrait.
        function fitContain(img) {
            const box = img.parentElement;
            const cs = getComputedStyle(box);
            const availW = box.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
            const availH = box.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
            const scale = Math.min(availW / img.naturalWidth, availH / img.naturalHeight);
            img.style.width = Math.round(img.naturalWidth * scale) + 'px';
            img.style.height = Math.round(img.naturalHeight * scale) + 'px';
        }

        // ========================================
        // GROUPER PAR ESPÈCE (ordre phylogénétique)
        // ========================================
        const speciesMap = {};
        const speciesOrder = []; // Pour garder l'ordre d'apparition (phylogénétique)

        photosData.forEach((photo, index) => {
            const sciName = photo.scientific;
            if (!speciesMap[sciName]) {
                speciesMap[sciName] = {
                    scientific: sciName,
                    name_fr: photo.name_fr,
                    name_en: photo.name_en,
                    iucn_status: photo.iucn_status,
                    photos: []
                };
                speciesOrder.push(sciName); // Garder l'ordre d'apparition
            }
            speciesMap[sciName].photos.push({...photo, globalIndex: index});
        });

        // Convertir en tableau en gardant l'ordre phylogénétique
        const speciesList = speciesOrder.map(sciName => speciesMap[sciName]);

        // ========================================
        // CHARGEMENT PROGRESSIF PAR ESPÈCE
        // ========================================
        const BATCH_SIZE = 24;  // Espèces par lot
        let displayedCount = 0;
        let activeLocationFilter = null;

        function getFilteredSpeciesList() {
            if (!activeLocationFilter) return speciesList;

            // Filtrer et recréer la liste avec seulement les photos du lieu
            // Garder l'ordre phylogénétique (pas de tri)
            return speciesList
                .map(sp => ({
                    ...sp,
                    photos: sp.photos.filter(p => p.location === activeLocationFilter)
                }))
                .filter(sp => sp.photos.length > 0);
        }

        function createSpeciesCard(species) {
            const card = document.createElement('div');
            card.className = 'species-card';
            card.dataset.species = species.scientific;
            card.title = species.scientific;
            card.style.cursor = 'pointer';
            card.onclick = () => openSpeciesLightbox(species.scientific);

            const name = currentLang === 'fr' ? species.name_fr : species.name_en;
            const firstPhoto = species.photos[0];
            const photoCount = species.photos.length;
            const badgeHtml = `<span class="photo-count-badge">${photoCount}</span>`;

            card.innerHTML = `
                <div class="card-image-wrapper">
                    <img src="https://cdn.download.ams.birds.cornell.edu/api/v2/asset/${firstPhoto.ml}/480"
                         alt="${name}"
                         loading="lazy"
                         onload="fitContain(this)">
                    ${badgeHtml}
                </div>
                <div class="species-info">
                    <span class="species-common">${name}</span>
                    <span class="species-sci">${species.scientific}</span>
                </div>
            `;

            return card;
        }

        function renderNextBatch() {
            const grid = document.getElementById('species-grid');
            const loadingIndicator = document.getElementById('loading-indicator');

            if (loadingIndicator) {
                loadingIndicator.style.display = 'none';
            }

            const filteredList = getFilteredSpeciesList();
            const endIndex = Math.min(displayedCount + BATCH_SIZE, filteredList.length);

            for (let i = displayedCount; i < endIndex; i++) {
                const species = filteredList[i];
                const card = createSpeciesCard(species);
                grid.appendChild(card);
            }

            displayedCount = endIndex;
            updateLoadMoreButton();
        }

        function updateLoadMoreButton() {
            const loadMoreContainer = document.getElementById('load-more-container');
            const remainingCount = document.getElementById('remaining-count');
            const filteredList = getFilteredSpeciesList();
            const remaining = filteredList.length - displayedCount;

            if (remaining > 0) {
                loadMoreContainer.style.display = 'block';
                const remainingText = currentLang === 'fr'
                    ? ` (${remaining} restante${remaining > 1 ? 's' : ''})`
                    : ` (${remaining} remaining)`;
                remainingCount.textContent = remainingText;
            } else {
                loadMoreContainer.style.display = 'none';
            }
        }

        function rebuildGrid() {
            const grid = document.getElementById('species-grid');
            grid.innerHTML = '';
            displayedCount = 0;
            renderNextBatch();
        }

        // Charger le premier lot au démarrage
        document.addEventListener('DOMContentLoaded', () => {
            rebuildGrid();
        });

        // Auto-charger au scroll + bouton retour en haut
        const backToTopBtn = document.getElementById('back-to-top');
        window.addEventListener('scroll', () => {
            if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 800) {
                const filteredList = getFilteredSpeciesList();
                if (displayedCount < filteredList.length) {
                    renderNextBatch();
                }
            }
            if (backToTopBtn) {
                backToTopBtn.classList.toggle('visible', window.scrollY > 400);
            }
        });

        // Cliquer une espèce ouvre le feed plein écran (infinite scroll) sur cette espèce
        function openSpeciesLightbox(sciName) {
            const idx = speciesList.findIndex(sp => sp.scientific === sciName);
            if (idx < 0) return;
            window.location.href = `${FEED_URL}?s=${idx}`;
        }

        // Lien direct vers une photo précise (?photo=<ML>) : ouvre le feed sur l'espèce concernée.
        // Retour du feed sur une espèce précise (?species=<nom scientifique>) : dérouler les
        // lots nécessaires (chargement progressif) puis défiler jusqu'à la carte, même si elle
        // n'était pas encore affichée.
        window.addEventListener('load', () => {
            const params = new URLSearchParams(window.location.search);

            const ml = params.get('photo');
            if (ml) {
                const idx = speciesList.findIndex(sp => sp.photos.some(p => p.ml === ml));
                if (idx >= 0) {
                    window.location.href = `${FEED_URL}?s=${idx}`;
                }
                return;
            }

            const targetSci = params.get('species');
            if (targetSci) {
                const filteredList = getFilteredSpeciesList();
                const idx = filteredList.findIndex(sp => sp.scientific === targetSci);
                if (idx >= 0) {
                    while (displayedCount <= idx) {
                        renderNextBatch();
                    }
                    const card = document.querySelector(`.species-card[data-species="${CSS.escape(targetSci)}"]`);
                    if (card) {
                        card.scrollIntoView({ block: 'center' });
                        card.classList.add('return-highlight');
                        setTimeout(() => card.classList.remove('return-highlight'), 1600);
                    }
                }
            }
        });
