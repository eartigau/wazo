        const BATCH_SIZE = 48;  // Photos par lot
        const showDateInOverlay = false;
        let displayedCount = 0;
        let currentIndex = 0;
        let map = null;
        let marker = null;
        
        function createPhotoCard(photo, index) {
            const card = document.createElement('div');
            card.className = 'photo-card';
            card.dataset.index = index;
            card.dataset.ml = photo.ml;
            card.dataset.location = photo.location || '';
            card.onclick = () => openLightbox(index);
            
            const name = currentLang === 'fr' ? photo.name_fr : photo.name_en;
            const date = currentLang === 'fr' ? photo.date_fr : photo.date_en;
            const dateHtml = showDateInOverlay ? ` · ${date}` : '';
            
            card.innerHTML = `
                <img src="https://cdn.download.ams.birds.cornell.edu/api/v2/asset/${photo.ml}/480"
                     alt="${name}"
                     loading="lazy">
                <div class="photo-overlay">
                    <div class="bird-name">${name}${dateHtml}</div>
                </div>
            `;
            
            return card;
        }
        
        function renderNextBatch() {
            const grid = document.getElementById('photos-grid');
            const loadingIndicator = document.getElementById('loading-indicator');
            
            if (loadingIndicator) {
                loadingIndicator.style.display = 'none';
            }
            
            const endIndex = Math.min(displayedCount + BATCH_SIZE, photosData.length);
            
            for (let i = displayedCount; i < endIndex; i++) {
                const photo = photosData[i];
                const card = createPhotoCard(photo, i);
                grid.appendChild(card);
            }
            
            displayedCount = endIndex;
            updateLoadMoreButton();
        }
        
        function updateLoadMoreButton() {
            const loadMoreContainer = document.getElementById('load-more-container');
            const remainingCount = document.getElementById('remaining-count');
            const remaining = photosData.length - displayedCount;
            
            if (remaining > 0) {
                loadMoreContainer.style.display = 'block';
                const remainingText = currentLang === 'fr' 
                    ? ` (${remaining} restante${remaining > 1 ? 's' : ''})` 
                    : ` (${remaining} remaining)`;
                remainingCount.textContent = remainingText;
            } else {
                loadMoreContainer.style.display = 'none';
            }
        }
        
        // Charger le premier lot au démarrage
        document.addEventListener('DOMContentLoaded', () => {
            renderNextBatch();
        });
        
        // Auto-charger au scroll
        window.addEventListener('scroll', () => {
            if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 800) {
                if (displayedCount < photosData.length) {
                    renderNextBatch();
                }
            }
        });

        function openLightbox(index) {
            const photo = photosData[index];
            if (!photo) return;

            currentIndex = index;
            
            // Image pleine résolution
            document.getElementById('lightbox-img').src = 
                `https://cdn.download.ams.birds.cornell.edu/api/v2/asset/${photo.ml}/2400`;
            
            // Infos selon la langue - famille sans parenthèses
            const familyCode = photo.family.split(' ')[0];  // Prendre juste "Anatidae" sans "(Ducks...)"
            document.getElementById('lightbox-family').textContent = familyCode;
            document.getElementById('lightbox-title').textContent = 
                currentLang === 'fr' ? photo.name_fr : photo.name_en;
            document.getElementById('lightbox-scientific').textContent = photo.scientific;
            document.getElementById('lightbox-location').textContent = 
                currentLang === 'fr' ? photo.location_fr : photo.location_en;
            document.getElementById('lightbox-date').innerHTML = 
                currentLang === 'fr' ? photo.date_fr : photo.date_en;
            document.getElementById('lightbox-ebird').href = 
                `https://ebird.org/checklist/${photo.checklist_id}`;

            // Carte - cachée sur mobile
            const mapDiv = document.getElementById('lightbox-map');
            const isMobile = window.innerWidth <= 768;
            
            if (photo.lat && photo.lng && !isMobile) {
                mapDiv.style.display = 'block';
                
                if (!map) {
                    map = L.map('lightbox-map', {
                        zoomControl: false,
                        attributionControl: false
                    });
                    
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        className: 'grayscale-tiles'
                    }).addTo(map);
                }
                
                map.setView([photo.lat, photo.lng], 8);
                
                const flamingoIcon = L.divIcon({
                    className: '',
                    html: '<div class="flamingo-marker">🦩</div>',
                    iconSize: [36, 36],
                    iconAnchor: [18, 18]
                });
                
                if (marker) {
                    marker.setLatLng([photo.lat, photo.lng]);
                } else {
                    marker = L.marker([photo.lat, photo.lng], { icon: flamingoIcon }).addTo(map);
                }
                
                setTimeout(() => map.invalidateSize(), 100);
            } else {
                mapDiv.style.display = 'none';
            }

            document.getElementById('lightbox').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.body.style.overflow = '';
        }

        function navigateLightbox(direction) {
            currentIndex = (currentIndex + direction + photosData.length) % photosData.length;
            openLightbox(currentIndex);
        }

        // Clavier
        document.addEventListener('keydown', (e) => {
            if (!document.getElementById('lightbox').classList.contains('active')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') navigateLightbox(-1);
            if (e.key === 'ArrowRight') navigateLightbox(1);
        });

        // Clic hors contenu pour fermer
        document.getElementById('lightbox').addEventListener('click', (e) => {
            if (e.target.id === 'lightbox') closeLightbox();
        });

        // Ouvrir une photo par ML number (pour liens depuis liste espèces)
        function openPhotoByML(ml) {
            const index = photosData.findIndex(p => p.ml === ml);
            if (index >= 0) {
                openLightbox(index);
            }
        }

        // Vérifier si URL contient un paramètre photo
        window.addEventListener('load', () => {
            const params = new URLSearchParams(window.location.search);
            const ml = params.get('photo');
            if (ml) {
                openPhotoByML(ml);
            }
        });

        
        
        // Menu mobile hamburger
        function toggleMobileMenu() {
            document.getElementById('navMenu').classList.toggle('active');
        }
        
        // Fermer menu au clic ailleurs
        document.addEventListener('click', (e) => {
            const nav = document.querySelector('nav');
            const menu = document.getElementById('navMenu');
            if (menu && !nav.contains(e.target)) {
                menu.classList.remove('active');
            }
        });
        
        // Swipe pour lightbox sur mobile
        let touchStartX = 0;
        let touchEndX = 0;
        
        document.getElementById('lightbox').addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });
        
        document.getElementById('lightbox').addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, { passive: true });
        
        function handleSwipe() {
            const diff = touchStartX - touchEndX;
            if (Math.abs(diff) > 50) {
                if (diff > 0) {
                    navigateLightbox(1); // Swipe gauche = suivant
                } else {
                    navigateLightbox(-1); // Swipe droite = précédent
                }
            }
        }
    </script>
</body>
</html>
