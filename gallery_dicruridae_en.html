<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="gallery.css">
</head>
<body>
    <!-- NAVIGATION CENTRÉE -->
    <nav>
        <div class="nav-container">
            <ul class="nav-menu">

                       >

                    </a>

                <li>
                    <a href="species_list_en.html" 
                       >

                <li>
                    <a href="gallery_recent_en.html" 
                       >
                        Recent Updates
                    </a>
                </li>
                
                <li>
                    <a href="voyages_index_en.html" 
                       >

                    </a>
                </li>
                
                <li>
                    <a href="familles_index_en.html" 
                       >
                        Families
                    </a>
                </li>
                
                <li>
                    <a href="sounds_gallery_en.html" 
                       >
                        Sounds
                    </a>
                </li>
                
            </ul>
            
            <!-- Sélecteur de langue -->
            <div class="lang-switch">
                <a href="gallery_dicruridae_fr.html" class="lang-btn" title="Français">
                    
                    <span class="flag">🇫🇷</span>
                    
                </a>
            </div>
        </div>
    </nav>

    <!-- EN-TÊTE -->
    <div class="gallery-header">
        <h1>Dicruridae Family</h1>
        
        <div class="gallery-subtitle">Drongos</div>
        
        <div class="stats">
            2 photos
            
             · 2 species
            
        </div>
    </div>

    

    <!-- GRILLE PHOTOS -->
    <div class="gallery-container">
        <div class="masonry-grid">
            
            <div class="photo-card" 
                 data-index="0"
                 data-ml="77193441"
                 onclick="openLightbox(0)">
                <img src="https://cdn.download.ams.birds.cornell.edu/api/v2/asset/77193441/480"
                     alt="Black Drongo"
                     loading="lazy">
                <div class="photo-overlay">
                    <div class="bird-name">Black Drongo</div>
                </div>
            </div>
            
            <div class="photo-card" 
                 data-index="1"
                 data-ml="74531051"
                 onclick="openLightbox(1)">
                <img src="https://cdn.download.ams.birds.cornell.edu/api/v2/asset/74531051/480"
                     alt="Ashy Drongo"
                     loading="lazy">
                <div class="photo-overlay">
                    <div class="bird-name">Ashy Drongo</div>
                </div>
            </div>
            
        </div>
    </div>

    <!-- LIGHTBOX -->
    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
        <button class="lightbox-nav lightbox-prev" onclick="navigateLightbox(-1)">&#10094;</button>
        <button class="lightbox-nav lightbox-next" onclick="navigateLightbox(1)">&#10095;</button>
        
        <div class="lightbox-content">
            <div class="lightbox-image-container">
                <img id="lightbox-img" src="" alt="">
            </div>
            <div class="lightbox-sidebar">
                <!-- Famille -->
                <div class="lightbox-family" id="lightbox-family"></div>
                
                <!-- Nom commun -->
                <h2 id="lightbox-title"></h2>
                
                <!-- Nom scientifique -->
                <p class="scientific-name" id="lightbox-scientific"></p>
                
                <!-- Section Info -->
                <div class="lightbox-info">
                    <div class="info-row" id="lightbox-location-row">
                        <span class="info-icon">🌍</span>
                        <span id="lightbox-location"></span>
                    </div>
                    <div class="info-row" id="lightbox-date-row">
                        <span class="info-icon">📅</span>
                        <span id="lightbox-date"></span>
                    </div>
                </div>
                
                <!-- Carte -->
                <div id="lightbox-map"></div>
                
                <!-- Lien eBird -->
                <a id="lightbox-ebird" href="#" target="_blank" class="ebird-link">
                    <img src="https://ebird.org/favicon.ico" alt="eBird" class="ebird-icon">
                    View on eBird
                </a>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer>
        <p>Data <a href="https://ebird.org" target="_blank">eBird</a> / <a href="https://macaulaylibrary.org" target="_blank">Macaulay Library</a> · Updated: December 7<sup>th</sup>, 2025</p>
        <p>© Étienne Artigau</p>
    </footer>

    <!-- SCRIPTS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const currentLang = 'en';
        
        const photosData = [
            
            {
                ml: "77193441",
                name_fr: "Drongo royal",
                name_en: "Black Drongo",
                scientific: "Dicrurus macrocercus",
                family: "Dicruridae (Drongos)",
                location_fr: "Mysore Palace, Inde",
                location_en: "Mysore Palace, India",
                date_fr: "10 novembre 2017",
                date_en: "November 10<sup>th</sup>, 2017",
                lat: 12.3037981,
                lng: 76.6566539,
                checklist_id: "S40409026"
            },
            
            {
                ml: "74531051",
                name_fr: "Drongo cendré",
                name_en: "Ashy Drongo",
                scientific: "Dicrurus leucophaeus",
                family: "Dicruridae (Drongos)",
                location_fr: "Mysore City Bird Atlas 1D, L & T -Infosys-DFRL complexes, Inde",
                location_en: "Mysore City Bird Atlas 1D, L & T -Infosys-DFRL complexes, India",
                date_fr: "8 novembre 2017",
                date_en: "November 8<sup>th</sup>, 2017",
                lat: 12.3602739,
                lng: 76.5989477,
                checklist_id: "S40372997"
            }
            
        ];

        let currentIndex = 0;
        let map = null;
        let marker = null;

        function openLightbox(index) {
            const photo = photosData[index];
            if (!photo) return;

            currentIndex = index;
            
            // Image pleine résolution
            document.getElementById('lightbox-img').src = 
                `https://cdn.download.ams.birds.cornell.edu/api/v2/asset/${photo.ml}/2400`;
            
            // Infos selon la langue - famille sans parenthèses
            const familyCode = photo.family.split(' ')[0];  // Prendre juste "Anatidae" sans "(Ducks...)"
            document.getElementById('lightbox-family').textContent = familyCode;
            document.getElementById('lightbox-title').textContent = 
                currentLang === 'fr' ? photo.name_fr : photo.name_en;
            document.getElementById('lightbox-scientific').textContent = photo.scientific;
            document.getElementById('lightbox-location').textContent = 
                currentLang === 'fr' ? photo.location_fr : photo.location_en;
            document.getElementById('lightbox-date').innerHTML = 
                currentLang === 'fr' ? photo.date_fr : photo.date_en;
            document.getElementById('lightbox-ebird').href = 
                `https://ebird.org/checklist/${photo.checklist_id}`;

            // Carte
            const mapDiv = document.getElementById('lightbox-map');
            if (photo.lat && photo.lng) {
                mapDiv.style.display = 'block';
                
                if (!map) {
                    map = L.map('lightbox-map', {
                        zoomControl: false,
                        attributionControl: false
                    });
                    
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        className: 'grayscale-tiles'
                    }).addTo(map);
                }
                
                map.setView([photo.lat, photo.lng], 8);
                
                const cameraIcon = L.divIcon({
                    className: 'camera-icon',
                    html: '<div class="camera-marker">📷</div>',
                    iconSize: [36, 36],
                    iconAnchor: [18, 18]
                });
                
                if (marker) {
                    marker.setLatLng([photo.lat, photo.lng]);
                } else {
                    marker = L.marker([photo.lat, photo.lng], { icon: cameraIcon }).addTo(map);
                }
                
                setTimeout(() => map.invalidateSize(), 100);
            } else {
                mapDiv.style.display = 'none';
            }

            document.getElementById('lightbox').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.body.style.overflow = '';
        }

        function navigateLightbox(direction) {
            currentIndex = (currentIndex + direction + photosData.length) % photosData.length;
            openLightbox(currentIndex);
        }

        // Clavier
        document.addEventListener('keydown', (e) => {
            if (!document.getElementById('lightbox').classList.contains('active')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') navigateLightbox(-1);
            if (e.key === 'ArrowRight') navigateLightbox(1);
        });

        // Clic hors contenu pour fermer
        document.getElementById('lightbox').addEventListener('click', (e) => {
            if (e.target.id === 'lightbox') closeLightbox();
        });

        // Ouvrir une photo par ML number (pour liens depuis liste espèces)
        function openPhotoByML(ml) {
            const index = photosData.findIndex(p => p.ml === ml);
            if (index >= 0) {
                openLightbox(index);
            }
        }

        // Vérifier si URL contient un paramètre photo
        window.addEventListener('load', () => {
            const params = new URLSearchParams(window.location.search);
            const ml = params.get('photo');
            if (ml) {
                openPhotoByML(ml);
            }
        });

        
    </script>
</body>
</html>
