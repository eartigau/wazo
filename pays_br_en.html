<body>

                <span class="lang-btn active" style="display: inline-flex; align-items: center; justify-content: center; padding: 6px 14px; border-radius: 16px; font-size: 13px; font-weight: 600; background: #2d5a27; color: white;">EN</span>

    <!-- EN-TÊTE -->
    <div class="gallery-header">
        
        <a href="pays_index_en.html" class="back-link" style="display: inline-flex; align-items: center; gap: 6px; color: var(--forest-green); font-size: 14px; font-weight: 500; margin-bottom: 12px; text-decoration: none;">
            ← All countries
        </a>
        
        <h1>🇧🇷 Brazil</h1>
        
        <div class="stats">
            8 photos
            
             · 8 species
            
        </div>

    <!-- CARTE DU VOYAGE -->
    <div class="trip-map-container">
        <div class="trip-map-header">
            <span class="map-icon">🗺️</span>
            Locations visited
            <span class="location-count">(1)</span>
        </div>
        <div id="trip-map"></div>
    </div>
    

    <!-- GRILLE PHOTOS -->
    <div class="gallery-container">
        
        <!-- Indicateur de filtre par lieu -->
        <div id="location-filter-indicator" class="location-filter-indicator" style="display: none;">
            <span class="filter-text">
                <span class="filter-icon">📍</span>
                <span id="filter-location-name"></span>
                <span id="filter-photo-count"></span>
            </span>
            <button onclick="resetLocationFilter()" class="filter-reset-btn">
                Show all ✕
            </button>
        </div>
        
        
        <div class="masonry-grid" id="photos-grid">
            <!-- Photos chargées dynamiquement par JavaScript -->
        </div>
        
        <!-- Indicateur de chargement -->
        <div id="loading-indicator" class="loading-indicator" style="text-align: center; padding: 40px; color: var(--text-medium);">
            Loading...
        </div>
        
        <!-- Bouton charger plus -->
        <div id="load-more-container" class="load-more-container" style="text-align: center; padding: 20px; display: none;">
            <button class="load-more-btn" id="load-more-btn" onclick="renderNextBatch()" style="background: linear-gradient(135deg, #2d5a27 0%, #4a7c39 100%); color: white; border: none; padding: 14px 32px; border-radius: 30px; font-size: 15px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 15px rgba(45, 90, 39, 0.3);">
                Show more photos
                <span id="remaining-count"></span>
            </button>
        </div>
    </div>

    <!-- LIGHTBOX -->
    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
        <button class="lightbox-nav lightbox-prev" onclick="navigateLightbox(-1)">&#10094;</button>
        <button class="lightbox-nav lightbox-next" onclick="navigateLightbox(1)">&#10095;</button>
        
        <div class="lightbox-content">
            <div class="lightbox-image-container">
                <img id="lightbox-img" src="" alt="">
            </div>
            <div class="lightbox-sidebar">
                <!-- Famille -->
                <div class="lightbox-family" id="lightbox-family"></div>
                
                <!-- Nom commun -->
                <h2 id="lightbox-title"></h2>
                
                <!-- Nom scientifique -->
                <p class="scientific-name" id="lightbox-scientific"></p>
                
                <!-- Section Info -->
                <div class="lightbox-info">
                    <div class="info-row" id="lightbox-location-row">
                        <span class="info-icon">🌍</span>
                        <span id="lightbox-location"></span>
                    </div>
                    <div class="info-row" id="lightbox-date-row">
                        <span class="info-icon">📅</span>
                        <span id="lightbox-date"></span>
                    </div>
                </div>
                
                <!-- Carte -->
                <div id="lightbox-map"></div>
                
                <!-- Lien eBird -->
                <a id="lightbox-ebird" href="#" target="_blank" class="ebird-link">
                    <img src="https://ebird.org/favicon.ico" alt="eBird" class="ebird-icon">
                    View on eBird
                </a>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer>
        <p>Data <a href="https://ebird.org" target="_blank">eBird</a> / <a href="https://macaulaylibrary.org" target="_blank">Macaulay Library</a> · Updated: January 8<sup>th</sup>, 2026</p>
        <p>© Étienne Artigau</p>
    </footer>

    <!-- SCRIPTS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const currentLang = 'en';
        
        const photosData = [
            
            {
                ml: "381157001",
                name_fr: "Tourterelle oreillarde",
                name_en: "Eared Dove",
                scientific: "Zenaida auriculata",
                family: "Columbidae (Pigeons and Doves)",
                location: "Foz do Iguaçu",
                location_fr: "Foz do Iguaçu, Brésil",
                location_en: "Foz do Iguaçu, Brazil",
                date_fr: "16 juin 2007",
                date_en: "June 16<sup>th</sup>, 2007",
                lat: -25.5671963,
                lng: -54.5562027,
                checklist_id: "S18690792"
            },
            
            {
                ml: "381156041",
                name_fr: "Ani à bec lisse",
                name_en: "Smooth-billed Ani",
                scientific: "Crotophaga ani",
                family: "Cuculidae (Cuckoos)",
                location: "Foz do Iguaçu",
                location_fr: "Foz do Iguaçu, Brésil",
                location_en: "Foz do Iguaçu, Brazil",
                date_fr: "16 juin 2007",
                date_en: "June 16<sup>th</sup>, 2007",
                lat: -25.5671963,
                lng: -54.5562027,
                checklist_id: "S18690792"
            },
            
            {
                ml: "22434721",
                name_fr: "Chevêche des terriers",
                name_en: "Burrowing Owl",
                scientific: "Athene cunicularia",
                family: "Strigidae (Owls)",
                location: "Foz do Iguaçu",
                location_fr: "Foz do Iguaçu, Brésil",
                location_en: "Foz do Iguaçu, Brazil",
                date_fr: "16 juin 2007",
                date_en: "June 16<sup>th</sup>, 2007",
                lat: -25.5671963,
                lng: -54.5562027,
                checklist_id: "S18690792"
            },
            
            {
                ml: "22434691",
                name_fr: "Pic dominicain",
                name_en: "White Woodpecker",
                scientific: "Melanerpes candidus",
                family: "Picidae (Woodpeckers)",
                location: "Foz do Iguaçu",
                location_fr: "Foz do Iguaçu, Brésil",
                location_en: "Foz do Iguaçu, Brazil",
                date_fr: "16 juin 2007",
                date_en: "June 16<sup>th</sup>, 2007",
                lat: -25.5671963,
                lng: -54.5562027,
                checklist_id: "S18690792"
            },
            
            {
                ml: "22434771",
                name_fr: "Conure nanday",
                name_en: "Nanday Parakeet",
                scientific: "Aratinga nenday",
                family: "Psittacidae (New World and African Parrots)",
                location: "Foz do Iguaçu",
                location_fr: "Foz do Iguaçu, Brésil",
                location_en: "Foz do Iguaçu, Brazil",
                date_fr: "16 juin 2007",
                date_en: "June 16<sup>th</sup>, 2007",
                lat: -25.5671963,
                lng: -54.5562027,
                checklist_id: "S18690792"
            },
            
            {
                ml: "22434701",
                name_fr: "Merle à ventre clair",
                name_en: "Creamy-bellied Thrush",
                scientific: "Turdus amaurochalinus",
                family: "Turdidae (Thrushes and Allies)",
                location: "Foz do Iguaçu",
                location_fr: "Foz do Iguaçu, Brésil",
                location_en: "Foz do Iguaçu, Brazil",
                date_fr: "16 juin 2007",
                date_en: "June 16<sup>th</sup>, 2007",
                lat: -25.5671963,
                lng: -54.5562027,
                checklist_id: "S18690792"
            },
            
            {
                ml: "22434711",
                name_fr: "Cassique cul-rouge",
                name_en: "Red-rumped Cacique",
                scientific: "Cacicus haemorrhous",
                family: "Icteridae (Troupials and Allies)",
                location: "Foz do Iguaçu",
                location_fr: "Foz do Iguaçu, Brésil",
                location_en: "Foz do Iguaçu, Brazil",
                date_fr: "16 juin 2007",
                date_en: "June 16<sup>th</sup>, 2007",
                lat: -25.5671963,
                lng: -54.5562027,
                checklist_id: "S18690792"
            },
            
            {
                ml: "22434731",
                name_fr: "Tangara coiffe-noire",
                name_en: "Hooded Tanager",
                scientific: "Nemosia pileata",
                family: "Thraupidae (Tanagers and Allies)",
                location: "Foz do Iguaçu",
                location_fr: "Foz do Iguaçu, Brésil",
                location_en: "Foz do Iguaçu, Brazil",
                date_fr: "16 juin 2007",
                date_en: "June 16<sup>th</sup>, 2007",
                lat: -25.5671963,
                lng: -54.5562027,
                checklist_id: "S18690792"
            }
            
        ];

        // ========================================
        // CHARGEMENT PROGRESSIF
        // ========================================
        const BATCH_SIZE = 48;  // Photos par lot
        const showDateInOverlay = false;
        let displayedCount = 0;
        let currentIndex = 0;
        let map = null;
        let marker = null;
        
        function createPhotoCard(photo, index) {
            const card = document.createElement('div');
            card.className = 'photo-card';
            card.dataset.index = index;
            card.dataset.ml = photo.ml;
            card.dataset.location = photo.location || '';
            card.onclick = () => openLightbox(index);
            
            const name = currentLang === 'fr' ? photo.name_fr : photo.name_en;
            const date = currentLang === 'fr' ? photo.date_fr : photo.date_en;
            const dateHtml = showDateInOverlay ? ` · ${date}` : '';
            
            card.innerHTML = `
                <img src="https://cdn.download.ams.birds.cornell.edu/api/v2/asset/${photo.ml}/480"
                     alt="${name}"
                     loading="lazy">
                <div class="photo-overlay">
                    <div class="bird-name">${name}${dateHtml}</div>
                </div>
            `;
            
            return card;
        }
        
        function renderNextBatch() {
            const grid = document.getElementById('photos-grid');
            const loadingIndicator = document.getElementById('loading-indicator');
            
            if (loadingIndicator) {
                loadingIndicator.style.display = 'none';
            }
            
            const endIndex = Math.min(displayedCount + BATCH_SIZE, photosData.length);
            
            for (let i = displayedCount; i < endIndex; i++) {
                const photo = photosData[i];
                const card = createPhotoCard(photo, i);
                grid.appendChild(card);
            }
            
            displayedCount = endIndex;
            updateLoadMoreButton();
        }
        
        function updateLoadMoreButton() {
            const loadMoreContainer = document.getElementById('load-more-container');
            const remainingCount = document.getElementById('remaining-count');
            const remaining = photosData.length - displayedCount;
            
            if (remaining > 0) {
                loadMoreContainer.style.display = 'block';
                const remainingText = currentLang === 'fr' 
                    ? ` (${remaining} restante${remaining > 1 ? 's' : ''})` 
                    : ` (${remaining} remaining)`;
                remainingCount.textContent = remainingText;
            } else {
                loadMoreContainer.style.display = 'none';
            }
        }
        
        // Charger le premier lot au démarrage
        document.addEventListener('DOMContentLoaded', () => {
            renderNextBatch();
        });
        
        // Auto-charger au scroll
        window.addEventListener('scroll', () => {
            if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 800) {
                if (displayedCount < photosData.length) {
                    renderNextBatch();
                }
            }
        });

        function openLightbox(index) {
            const photo = photosData[index];
            if (!photo) return;

            currentIndex = index;
            
            // Image pleine résolution
            document.getElementById('lightbox-img').src = 
                `https://cdn.download.ams.birds.cornell.edu/api/v2/asset/${photo.ml}/2400`;
            
            // Infos selon la langue - famille sans parenthèses
            const familyCode = photo.family.split(' ')[0];  // Prendre juste "Anatidae" sans "(Ducks...)"
            document.getElementById('lightbox-family').textContent = familyCode;
            document.getElementById('lightbox-title').textContent = 
                currentLang === 'fr' ? photo.name_fr : photo.name_en;
            document.getElementById('lightbox-scientific').textContent = photo.scientific;
            document.getElementById('lightbox-location').textContent = 
                currentLang === 'fr' ? photo.location_fr : photo.location_en;
            document.getElementById('lightbox-date').innerHTML = 
                currentLang === 'fr' ? photo.date_fr : photo.date_en;
            document.getElementById('lightbox-ebird').href = 
                `https://ebird.org/checklist/${photo.checklist_id}`;

            // Carte - cachée sur mobile
            const mapDiv = document.getElementById('lightbox-map');
            const isMobile = window.innerWidth <= 768;
            
            if (photo.lat && photo.lng && !isMobile) {
                mapDiv.style.display = 'block';
                
                if (!map) {
                    map = L.map('lightbox-map', {
                        zoomControl: false,
                        attributionControl: false
                    });
                    
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        className: 'grayscale-tiles'
                    }).addTo(map);
                }
                
                map.setView([photo.lat, photo.lng], 8);
                
                const cameraIcon = L.divIcon({
                    className: 'camera-icon',
                    html: '<div class="camera-marker">📷</div>',
                    iconSize: [36, 36],
                    iconAnchor: [18, 18]
                });
                
                if (marker) {
                    marker.setLatLng([photo.lat, photo.lng]);
                } else {
                    marker = L.marker([photo.lat, photo.lng], { icon: cameraIcon }).addTo(map);
                }
                
                setTimeout(() => map.invalidateSize(), 100);
            } else {
                mapDiv.style.display = 'none';
            }

            document.getElementById('lightbox').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.body.style.overflow = '';
        }

        function navigateLightbox(direction) {
            currentIndex = (currentIndex + direction + photosData.length) % photosData.length;
            openLightbox(currentIndex);
        }

        // Clavier
        document.addEventListener('keydown', (e) => {
            if (!document.getElementById('lightbox').classList.contains('active')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') navigateLightbox(-1);
            if (e.key === 'ArrowRight') navigateLightbox(1);
        });

        // Clic hors contenu pour fermer
        document.getElementById('lightbox').addEventListener('click', (e) => {
            if (e.target.id === 'lightbox') closeLightbox();
        });

        // Ouvrir une photo par ML number (pour liens depuis liste espèces)
        function openPhotoByML(ml) {
            const index = photosData.findIndex(p => p.ml === ml);
            if (index >= 0) {
                openLightbox(index);
            }
        }

        // Vérifier si URL contient un paramètre photo
        window.addEventListener('load', () => {
            const params = new URLSearchParams(window.location.search);
            const ml = params.get('photo');
            if (ml) {
                openPhotoByML(ml);
            }
        });

        
        // Carte du voyage avec filtrage par lieu
        const tripLocations = [
            
            { lat: -25.5671963, lng: -54.5562027, name: "Foz do Iguaçu" },
            
        ];
        
        // Compter les photos par lieu
        function countPhotosByLocation(locationName) {
            return photosData.filter(p => p.location === locationName).length;
        }
        
        // Variable pour garder le filtre actif
        let activeLocationFilter = null;
        
        // Filtrer les photos par lieu
        function filterByLocation(locationName) {
            activeLocationFilter = locationName;
            
            // Charger toutes les photos restantes avant de filtrer
            while (displayedCount < photosData.length) {
                renderNextBatch();
            }
            
            const photoCards = document.querySelectorAll('.photo-card');
            let visibleCount = 0;
            
            photoCards.forEach(card => {
                const cardLocation = card.getAttribute('data-location');
                if (cardLocation === locationName) {
                    card.style.display = '';
                    visibleCount++;
                } else {
                    card.style.display = 'none';
                }
            });
            
            // Cacher le bouton "charger plus" quand filtré
            document.getElementById('load-more-container').style.display = 'none';
            
            // Afficher l'indicateur de filtre
            const indicator = document.getElementById('location-filter-indicator');
            const locationNameSpan = document.getElementById('filter-location-name');
            const photoCountSpan = document.getElementById('filter-photo-count');
            
            if (indicator) {
                locationNameSpan.textContent = locationName;
                photoCountSpan.textContent = currentLang === 'fr' 
                    ? ` (${visibleCount} photo${visibleCount > 1 ? 's' : ''})` 
                    : ` (${visibleCount} photo${visibleCount > 1 ? 's' : ''})`;
                indicator.style.display = 'flex';
            }
            
            // Scroll vers la grille
            document.querySelector('.gallery-container').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
        
        // Réinitialiser le filtre
        function resetLocationFilter() {
            activeLocationFilter = null;
            const photoCards = document.querySelectorAll('.photo-card');
            photoCards.forEach(card => {
                card.style.display = '';
            });
            
            const indicator = document.getElementById('location-filter-indicator');
            if (indicator) {
                indicator.style.display = 'none';
            }
        }

        if (tripLocations.length > 0) {
            // Créer la carte
            const tripMap = L.map('trip-map', {
                scrollWheelZoom: false,
                zoomControl: true
            });

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap'
            }).addTo(tripMap);

            // Icône personnalisée pour les épingles
            const pinIcon = L.divIcon({
                html: '<div class="trip-pin">📍</div>',
                className: 'trip-pin-container',
                iconSize: [24, 24],
                iconAnchor: [12, 24],
                popupAnchor: [0, -24]
            });

            // Ajouter les marqueurs avec compte de photos et filtrage
            const markers = [];
            tripLocations.forEach(loc => {
                const marker = L.marker([loc.lat, loc.lng], { icon: pinIcon });
                const photoCount = countPhotosByLocation(loc.name);
                
                if (loc.name) {
                    // Popup avec nom et compte de photos
                    const popupContent = `
                        <div class="trip-popup-content">
                            <strong>${loc.name}</strong>
                            <div class="popup-photo-count">${photoCount} photo${photoCount > 1 ? 's' : ''}</div>
                            <button class="popup-filter-btn" onclick="filterByLocation('${loc.name.replace(/'/g, "\\'")}')">
                                ${currentLang === 'fr' ? 'Voir ces photos' : 'View photos'}
                            </button>
                        </div>
                    `;
                    marker.bindPopup(popupContent, { className: 'trip-popup' });
                }
                
                // Clic direct sur le marqueur (pas le popup) pour filtrer
                marker.on('click', function(e) {
                    // Ne pas filtrer si on ouvre juste le popup
                    // Le filtrage se fait via le bouton dans le popup
                });
                
                marker.addTo(tripMap);
                markers.push(marker);
            });

            // Ajuster la vue pour montrer tous les marqueurs
            if (markers.length > 0) {
                const group = L.featureGroup(markers);
                tripMap.fitBounds(group.getBounds().pad(0.1));
                
                // Limiter le zoom max pour garder du contexte
                if (tripMap.getZoom() > 10) {
                    tripMap.setZoom(10);
                }
            }
        }
        
        
        // Menu mobile hamburger
        function toggleMobileMenu() {
            document.getElementById('navMenu').classList.toggle('active');
        }
        
        // Fermer menu au clic ailleurs
        document.addEventListener('click', (e) => {
            const nav = document.querySelector('nav');
            const menu = document.getElementById('navMenu');
            if (menu && !nav.contains(e.target)) {
                menu.classList.remove('active');
            }
        });
        
        // Swipe pour lightbox sur mobile
        let touchStartX = 0;
        let touchEndX = 0;
        
        document.getElementById('lightbox').addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });
        
        document.getElementById('lightbox').addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, { passive: true });
        
        function handleSwipe() {
            const diff = touchStartX - touchEndX;
            if (Math.abs(diff) > 50) {
                if (diff > 0) {
                    navigateLightbox(1); // Swipe gauche = suivant
                } else {
                    navigateLightbox(-1); // Swipe droite = précédent
                }
            }
        }
    </script>
</body>
</html>
