        /* Marqueur flamant rose */
        .flamingo-marker {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            border-radius: 50%;
            border: 3px solid #2d5a27;
            box-shadow: 0 3px 10px rgba(0,0,0,0.3);
            font-size: 20px;
        }
        
        /* Badge de statut IUCN */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 4px;
            margin-top: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .status-CR { background: #d32f2f; color: white; }
        .status-EN { background: #f57c00; color: white; }
        .status-VU { background: #fbc02d; color: #333; }
        .status-NT { background: #81c784; color: #333; }
        .status-DD { background: #9e9e9e; color: white; }
        .status-EW { background: #6a1b9a; color: white; }
        .status-EX { background: #000000; color: white; }
        
        /* Section par statut */
        .status-section {
            margin-bottom: 50px;
        }
        .status-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: 'Lora', Georgia, serif;
            font-size: 24px;
            font-weight: 600;
            color: var(--forest-green);
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--sage-light);
        }
        .status-title .status-badge {
            font-size: 13px;
            padding: 5px 12px;
        }
        .status-count {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-medium);
            margin-left: auto;
        }

        // ========================================
        // ÉTAT DE L'APPLICATION
        // ========================================
        let displayedCount = 0;
        let filteredSpecies = [...speciesListData];
        let currentSearchQuery = '';
        let renderedStatuses = new Set();
        
        let currentSpecies = null;
        let currentPhotoIndex = 0;
        let map = null;

        // ========================================
        // RENDU DYNAMIQUE DES CARTES
        // ========================================
        
        function normalizeText(text) {
            return text.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
        }
        
        function createSpeciesCard(sp) {
            const card = document.createElement('div');
            card.className = 'species-card';
            card.dataset.species = sp.sciName;
            card.dataset.nameFr = sp.nameFr.toLowerCase();
            card.dataset.nameEn = sp.nameEn.toLowerCase();
            card.dataset.sciName = sp.sciName.toLowerCase();
            card.onclick = () => openSpeciesLightbox(sp.sciName);
            
            const name = currentLang === 'fr' ? sp.nameFr : sp.nameEn;
            const photoCountHtml = sp.photoCount > 1 
                ? `<span class="photo-count">${sp.photoCount} photos</span>` 
                : (sp.photoCount === 1 ? `<span class="photo-count">1 photo</span>` : '');
            
            card.innerHTML = `
                <img src="https://cdn.download.ams.birds.cornell.edu/api/v2/asset/${sp.ml}/480" 
                     alt="${name}"
                     loading="lazy">
                <div class="species-info">
                    <span class="species-common">${name}</span>
                    <span class="species-scientific">${sp.sciName}</span>
                    ${photoCountHtml}
                </div>
            `;
            
            return card;
        }
        
        function createStatusSection(statusCode, statusNameFr, statusNameEn, count) {
            const section = document.createElement('div');
            section.className = 'status-section';
            section.id = 'status-' + statusCode;
            section.dataset.status = statusCode;
            
            const name = currentLang === 'fr' ? statusNameFr : statusNameEn;
            const countLabel = currentLang === 'fr' 
                ? `${count} espèce${count > 1 ? 's' : ''}`
                : `${count} species`;
            
            section.innerHTML = `
                <h2 class="status-title">
                    <span class="status-badge status-${statusCode}">${statusCode}</span>
                    ${name}
                    <span class="status-count">${countLabel}</span>
                </h2>
                <div class="species-grid"></div>
            `;
            
            return section;
        }
        
        function renderNextBatch() {
            const container = document.getElementById('species-list-dynamic');
            const loadingIndicator = document.getElementById('loading-indicator');
            
            // Cacher l'indicateur de chargement initial
            if (loadingIndicator) {
                loadingIndicator.style.display = 'none';
            }
            
            const toRender = filteredSpecies.slice(displayedCount, displayedCount + BATCH_SIZE);
            
            if (toRender.length === 0) {
                updateLoadMoreButton();
                return;
            }
            
            // Compter les espèces par statut (pour le titre de section)
            const statusCounts = {};
            filteredSpecies.forEach(sp => {
                statusCounts[sp.statusCode] = (statusCounts[sp.statusCode] || 0) + 1;
            });
            
            // Grouper par statut
            toRender.forEach(sp => {
                let statusSection = document.getElementById('status-' + sp.statusCode);
                
                // Créer la section statut si elle n'existe pas
                if (!statusSection) {
                    statusSection = createStatusSection(
                        sp.statusCode, 
                        sp.statusNameFr, 
                        sp.statusNameEn,
                        statusCounts[sp.statusCode]
                    );
                    container.appendChild(statusSection);
                    renderedStatuses.add(sp.statusCode);
                }
                
                // Ajouter la carte d'espèce
                const grid = statusSection.querySelector('.species-grid');
                const card = createSpeciesCard(sp);
                
                // Ajouter classe highlight si recherche active
                if (currentSearchQuery.length >= 2) {
                    card.classList.add('search-highlight');
                }
                
                grid.appendChild(card);
            });
            
            displayedCount += toRender.length;
            updateLoadMoreButton();
        }
        
        function updateLoadMoreButton() {
            const container = document.getElementById('load-more-container');
            const remaining = filteredSpecies.length - displayedCount;
            
            if (remaining > 0) {
                container.style.display = 'flex';
                document.getElementById('remaining-count').textContent = 
                    ` (${remaining} ${currentLang === 'fr' ? 'restantes' : 'remaining'})`;
            } else {
                container.style.display = 'none';
            }
        }
        
        function resetAndRender() {
            const container = document.getElementById('species-list-dynamic');
            // Garder uniquement l'indicateur de chargement
            const loadingIndicator = document.getElementById('loading-indicator');
            container.innerHTML = '';
            if (loadingIndicator) {
                container.appendChild(loadingIndicator);
            }
            
            displayedCount = 0;
            renderedStatuses.clear();
            renderNextBatch();
        }

        // ========================================
        // LIGHTBOX
        // ========================================
        
        function openSpeciesLightbox(sciName) {
            currentSpecies = speciesData[sciName];
            if (!currentSpecies) return;
            
            currentPhotoIndex = 0;
            showCurrentPhoto();
            
            document.getElementById('lightbox').classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        
        function showCurrentPhoto() {
            if (!currentSpecies || !currentSpecies.photos.length) return;
            
            const photo = currentSpecies.photos[currentPhotoIndex];
            
            // Image
            document.getElementById('lightbox-img').src = 
                `https://cdn.download.ams.birds.cornell.edu/api/v2/asset/${photo.ml}/2400`;
            
            // Statut IUCN
            const statusEl = document.getElementById('lightbox-status');
            statusEl.innerHTML = `<span class="status-badge status-${currentSpecies.status}">${currentSpecies.status}</span> ${currentLang === 'fr' ? currentSpecies.status_name_fr : currentSpecies.status_name_en}`;
            
            // Nom
            document.getElementById('lightbox-title').textContent = 
                currentLang === 'fr' ? currentSpecies.name_fr : currentSpecies.name_en;
            document.getElementById('lightbox-scientific').textContent = currentSpecies.scientific;
            
            // Compteur
            const counter = document.getElementById('lightbox-counter');
            if (currentSpecies.photos.length > 1) {
                counter.textContent = `${currentPhotoIndex + 1} / ${currentSpecies.photos.length}`;
                counter.style.display = 'block';
            } else {
                counter.style.display = 'none';
            }
            
            // Lieu et date
            document.getElementById('lightbox-location').textContent = 
                currentLang === 'fr' ? photo.location_fr : photo.location_en;
            document.getElementById('lightbox-date').innerHTML = 
                currentLang === 'fr' ? photo.date_fr : photo.date_en;
            document.getElementById('lightbox-ebird').href = 
                `https://ebird.org/checklist/${photo.checklist_id}`;
            
            // Carte
            const mapDiv = document.getElementById('lightbox-map');
            const isMobile = window.innerWidth <= 768;
            
            if (photo.lat && photo.lng && !isMobile) {
                mapDiv.style.display = 'block';
                
                if (!map) {
                    map = L.map('lightbox-map', {
                        zoomControl: false,
                        attributionControl: false
                    });
                    
                    // OpenStreetMap standard
                    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        maxZoom: 19
                    }).addTo(map);
                }
                
                map.setView([photo.lat, photo.lng], 8);
                
                const flamingoIcon = L.divIcon({
                    className: '',
                    html: '<div class="flamingo-marker">🦩</div>',
                    iconSize: [36, 36],
                    iconAnchor: [18, 18]
                });
                
                if (marker) {
                    marker.setLatLng([photo.lat, photo.lng]);
                } else {
                    marker = L.marker([photo.lat, photo.lng], { icon: flamingoIcon }).addTo(map);
                }
                
                setTimeout(() => map.invalidateSize(), 100);
            } else {
                mapDiv.style.display = 'none';
            }
        }
        
        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.body.style.overflow = '';
        }
        
        function navigateLightbox(direction) {
            if (!currentSpecies) return;
            const total = currentSpecies.photos.length;
            currentPhotoIndex = (currentPhotoIndex + direction + total) % total;
            showCurrentPhoto();
        }
        
        // Clavier
        document.addEventListener('keydown', (e) => {
            if (!document.getElementById('lightbox').classList.contains('active')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') navigateLightbox(-1);
            if (e.key === 'ArrowRight') navigateLightbox(1);
        });
        
        // Clic hors contenu
        document.getElementById('lightbox').addEventListener('click', (e) => {
            if (e.target.id === 'lightbox') closeLightbox();
        });

        // ========================================
        // INITIALISATION
        // ========================================
        
        // Premier rendu au chargement
        document.addEventListener('DOMContentLoaded', () => {
            renderNextBatch();
        });
        
        // Charger plus au scroll
        window.addEventListener('scroll', () => {
            if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 800) {
                if (displayedCount < filteredSpecies.length) {
                    renderNextBatch();
                }
            }
        });
        
        // Menu mobile
        function toggleMobileMenu() {
            document.getElementById('navMenu').classList.toggle('active');
        }
        
        document.addEventListener('click', (e) => {
            const nav = document.querySelector('nav');
            const menu = document.getElementById('navMenu');
            if (menu && !nav.contains(e.target)) {
                menu.classList.remove('active');
            }
        });
    </script>
</body>
</html>
